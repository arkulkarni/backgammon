<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1512" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#d9c9a4" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="icon" href="data:," />
<title>Backgammon</title>
<style>
:root{
  color-scheme: light dark;
  --room1:#2b170a; --room2:#120906;
  --frame1:#9a542d; --frame2:#633114;
  --felt1:#d8b77b; --felt2:#c99b5e;
  --bar1:#955a32; --bar2:#70401f;
  --tri-a:#ead29b; --tri-b:#a15443;
  --ink:#f6e8cf; --muted:#c8ae85;
  --gold:#ffd12e; --red:#c33a24; --red2:#e0644f;
  --w-face1:#f4f0e8; --w-face2:#d8d0c1; --w-ring:#b7b4ad;
  --b-face1:#414650; --b-face2:#242932; --b-ring:#969ba3;
  --card:#1d150e; --panel-b:rgba(255,220,170,.14);
  --toast:#241a10; --toast-ink:#ffe9c9;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1300px 850px at 45% 30%, var(--room1), var(--room2));
  overflow:hidden; height:100dvh;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
#app{height:100dvh; display:flex; align-items:stretch;}
/* Portrait is a hard stop rather than an alternate game layout. The gate lives
   outside #app so the board, dialogs and all controls can be hidden and made
   inert without disturbing their landscape geometry or in-progress state. */
#orientationGate{
  position:fixed; inset:0; z-index:1000; display:none;
  align-items:center; justify-content:center; overflow:hidden;
  padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right))
          max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  background:
    radial-gradient(ellipse at 50% 38%,rgba(159,98,50,.24),transparent 54%),
    linear-gradient(145deg,#2b170a,#100805 72%);
  color:#f6e8cf; text-align:center;
}
body.portrait-blocked #orientationGate{display:flex;}
body.portrait-blocked #app,
body.portrait-blocked > #overlay,
body.portrait-blocked #toast,
body.portrait-blocked .bearFlight{
  visibility:hidden!important; pointer-events:none!important;
}
.orientationPrompt{max-width:430px;}
.orientationDevice{
  width:136px; height:88px; margin:0 auto 26px; position:relative;
  border:7px solid #dca06b; border-radius:17px;
  background:linear-gradient(135deg,#d8b77b 0 50%,#a15443 50% 100%);
  box-shadow:0 12px 28px rgba(0,0,0,.38),inset 0 0 0 4px #43210e;
}
.orientationDevice::after{
  content:""; position:absolute; right:4px; top:50%; width:5px; height:5px;
  border-radius:50%; background:#5c2d12; transform:translateY(-50%);
}
.orientationPrompt h1{
  margin:0 0 10px; color:#fff3dd;
  font:800 clamp(27px,7vw,38px)/1.12 Georgia,'Times New Roman',serif;
  letter-spacing:.01em;
}
.orientationPrompt p{margin:0;color:#d8c5a6;font-size:clamp(15px,4vw,18px);line-height:1.45;}
@media (orientation:portrait){
  #orientationGate{display:flex;}
}
html:fullscreen,html:-webkit-full-screen,html:fullscreen body,html:-webkit-full-screen body,
html:fullscreen #app,html:-webkit-full-screen #app,#app:fullscreen,#app:-webkit-full-screen{
  width:100%;height:100%;background:radial-gradient(1300px 850px at 45% 30%, var(--room1), var(--room2));
}
#playArea{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;}
/* ---------- board stage ---------- */
#stage{flex:1 1 auto; min-width:0; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px; position:relative;}
#reviewTimelineDock{display:none;}
#board{width:100%; height:100%; touch-action:none; cursor:pointer; outline:none;}
#btnRoll{
  position:absolute; z-index:18; margin:0; padding:0; width:108px; height:39px;
  transform:translate(-50%,-50%); pointer-events:auto; touch-action:manipulation;
}
#btnRoll[hidden]{display:none;}
#confetti{
  position:fixed; inset:0; z-index:45; pointer-events:none; overflow:hidden;
}
#confetti[hidden]{display:none;}
.confettiPiece{
  position:absolute; top:-28px; left:var(--left); width:var(--w); height:var(--h);
  border-radius:var(--radius); background:var(--c); opacity:0;
  transform-origin:center; will-change:transform,opacity;
  animation:confettiFall var(--dur) linear var(--delay) both;
}
.confettiPiece.streamer{height:3px;border-radius:999px;}
.confettiPiece.diamond{border-radius:1px;}
@keyframes confettiFall{
  0%{opacity:0;transform:translate3d(0,-4vh,0) rotate(0deg);}
  4%{opacity:1;}
  28%{transform:translate3d(var(--sway-a),28vh,0) rotate(var(--spin-a));}
  58%{opacity:1;transform:translate3d(var(--sway-b),64vh,0) rotate(var(--spin-b));}
  88%{opacity:1;}
  100%{opacity:0;transform:translate3d(var(--sway-c),112vh,0) rotate(var(--spin-c));}
}
/* ---------- side panel strip ---------- */
#side{
  flex:0 0 176px; display:grid; grid-template-rows:1fr auto 1fr;
  gap:10px; padding:14px 10px; margin-right:10px; align-items:center;
  background:
    linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,235,200,.06), rgba(0,0,0,.28)),
    repeating-linear-gradient(92deg, #b9803f 0 7px, #a97134 7px 14px);
  border-radius:14px; align-self:center; height:calc(100dvh - 28px);
  box-shadow:inset 0 0 24px rgba(60,30,5,.55), 0 8px 22px rgba(0,0,0,.4);
  border:1px solid rgba(70,38,12,.8);
}
.pblk{width:100%; text-align:center; padding:6px 4px;}
/* Your panel sits at the bottom (your side of the board), the computer's at top. */
#blkHuman{grid-row:3;align-self:end;}
#side .mid{grid-row:2;align-self:center;}
#blkOpp{grid-row:1;align-self:start;}
.offBadge{
  width:64px; height:64px; border-radius:50%; margin:2px auto 8px; padding:0;
  display:flex; align-items:center; justify-content:center;
  appearance:none; font-family:inherit; font-size:26px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;
  border:3px solid var(--gold);
  box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.25);
}
button.offBadge{cursor:default; touch-action:manipulation;}
button.offBadge.ready{
  position:relative; isolation:isolate; cursor:pointer; border-color:#fff08a;
  box-shadow:0 0 0 4px rgba(255,209,46,.54),0 0 22px 9px rgba(255,188,24,.48),0 5px 14px rgba(0,0,0,.5),inset 0 0 12px rgba(255,224,89,.34),inset 0 2px 3px rgba(255,255,255,.35);
  animation:bearReadyPulse 1.25s ease-in-out infinite;
}
button.offBadge.ready::after{
  content:""; position:absolute; inset:-10px; border:3px solid rgba(255,225,91,.88); border-radius:50%;
  pointer-events:none; box-shadow:0 0 12px rgba(255,202,36,.68);
  animation:bearReadyRing 1.25s ease-out infinite;
}
button.offBadge.ready:active{transform:scale(.95);}
@keyframes bearReadyPulse{
  0%,100%{filter:brightness(1);box-shadow:0 0 0 3px rgba(255,209,46,.46),0 0 15px 6px rgba(255,188,24,.38),0 5px 14px rgba(0,0,0,.5),inset 0 0 9px rgba(255,224,89,.26),inset 0 2px 3px rgba(255,255,255,.35);}
  50%{filter:brightness(1.22);box-shadow:0 0 0 6px rgba(255,225,91,.68),0 0 28px 13px rgba(255,188,24,.60),0 5px 14px rgba(0,0,0,.5),inset 0 0 17px rgba(255,232,117,.48),inset 0 2px 3px rgba(255,255,255,.40);}
}
@keyframes bearReadyRing{
  0%{opacity:.95;transform:scale(.82);}
  75%,100%{opacity:0;transform:scale(1.28);}
}
@media (prefers-reduced-motion:reduce){
  button.offBadge.ready,button.offBadge.ready::after{animation:none;}
  button.offBadge.ready::after{opacity:1;transform:none;}
}
.offBadge.black{background:radial-gradient(circle at 39% 34%, #454a54, #242831 78%); color:#fff;}
.offBadge.white{background:radial-gradient(circle at 39% 34%, #f6f2e9, #d5ccbd 80%); color:#2a2118;}
.pname{color:var(--gold); font-weight:800; font-size:17px; letter-spacing:.02em; margin:2px 0 5px;
  text-shadow:0 1px 3px rgba(0,0,0,.5); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pline{color:#fff; font-size:14.5px; font-weight:600; line-height:1.5; text-shadow:0 1px 3px rgba(0,0,0,.55); font-variant-numeric:tabular-nums;}
.pbtn,.headBtn,.btnOkay{
  appearance:none; border:1px solid #7f2116; border-radius:9px; cursor:pointer;
  color:#fff8ee; background:linear-gradient(180deg,#e35a40 0%,#c93625 48%,#9e2016 100%);
  box-shadow:0 5px 11px rgba(35,14,6,.42),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(78,13,8,.5);
  text-shadow:0 1px 1px rgba(70,15,8,.8);
  font-family:inherit; font-weight:850; letter-spacing:.09em;
  transition:filter .12s ease,transform .12s ease,box-shadow .12s ease;
  touch-action:manipulation;
}
.pbtn{
  display:block; width:100%; margin:8px 0; padding:11px 0;
  font-size:14px;
}
.pbtn:active,.headBtn:active,.btnOkay:active{
  transform:translateY(1px);
  filter:saturate(.92) brightness(.96);
  box-shadow:0 2px 5px rgba(35,14,6,.38),inset 0 1px 2px rgba(78,13,8,.35);
}
.pbtn:disabled{opacity:.38;filter:saturate(.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);}
/* ---------- toast ---------- */
#toast{
  position:fixed; left:44%; top:14px; z-index:70; pointer-events:none;
  transform:translate(-50%,-16px); opacity:0; transition:opacity .22s, transform .22s;
  background:var(--toast); color:var(--toast-ink); font-weight:650; font-size:14.5px;
  padding:10px 18px; border-radius:11px; box-shadow:0 8px 20px rgba(0,0,0,.5); max-width:86vw; text-align:center;
}
#toast.show{opacity:1; transform:translate(-50%,0);}
/* ---------- thinking indicator (hard) ---------- */
.thinkDots{display:inline-flex;gap:5px;margin-left:9px;vertical-align:middle;}
.thinkDots[hidden]{display:none;}
.thinkDots i{width:8px;height:8px;border-radius:50%;background:#ffd9a0;opacity:.25;animation:thinkPulse 1.1s infinite;box-shadow:0 0 6px rgba(255,217,160,.7);}
.thinkDots i:nth-child(2){animation-delay:.18s;}
.thinkDots i:nth-child(3){animation-delay:.36s;}
@keyframes thinkPulse{0%,100%{opacity:.25;transform:scale(.85);}50%{opacity:1;transform:scale(1.15);}}
#blkOpp.thinking{animation:oppGlow 1.6s ease-in-out infinite;border-radius:10px;}
@keyframes oppGlow{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,217,160,.15);}50%{box-shadow:inset 0 0 0 2px rgba(255,217,160,.55),0 0 14px rgba(255,217,160,.25);}}
/* ---------- thinking indicator (hard, foreground) ---------- */
#thinkIndicator{position:absolute;left:50%;top:5%;transform:translateX(-50%);z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:7px;}
#thinkIndicator[hidden]{display:none;}
#thinkIndicator .thinkGlyph{width:38px;height:38px;animation:thinkFloat 1.6s ease-in-out infinite;}
#thinkIndicator .thinkGlyph svg{width:100%;height:100%;display:block;transform-box:fill-box;transform-origin:center;animation:thinkTwinkle 1.6s ease-in-out infinite;}
@keyframes thinkFloat{0%,100%{transform:translateY(3px);}50%{transform:translateY(-13px);}}
@keyframes thinkTwinkle{0%,100%{transform:scale(.85) rotate(-10deg);filter:drop-shadow(0 0 4px rgba(255,209,46,.55));opacity:.78;}50%{transform:scale(1.15) rotate(10deg);filter:drop-shadow(0 0 16px rgba(255,216,90,1));opacity:1;}}
#thinkIndicator .thinkLabel{font-variant:small-caps;letter-spacing:.16em;text-indent:.16em;font-size:13px;color:#f3d9a4;text-shadow:0 1px 8px rgba(0,0,0,.65);white-space:nowrap;animation:thinkLabelBreathe 2.2s ease-in-out infinite;}
@keyframes thinkLabelBreathe{0%,100%{opacity:.75;}50%{opacity:1;}}
#thinkIndicator .thinkLabel .eldot{animation:thinkEl 1.8s infinite;}
#thinkIndicator .thinkLabel .eldot:nth-child(2){animation-delay:.3s;}
#thinkIndicator .thinkLabel .eldot:nth-child(3){animation-delay:.6s;}
@keyframes thinkEl{0%,100%{opacity:.2;}50%{opacity:1;}}
/* ---------- end thinking indicator ---------- */
/* ---------- overlays ---------- */
.overlay{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px;
  background:rgba(8,5,3,.66); backdrop-filter:blur(5px);}
.overlay.setupMode,.overlay.outcomeMode{
  flex-direction:column; align-items:center; justify-content:flex-start; overflow-y:auto;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  padding-top:max(24px,calc(env(safe-area-inset-top) + 18px));
  padding-right:max(16px,calc(env(safe-area-inset-right) + 16px));
  padding-bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));
  padding-left:max(16px,calc(env(safe-area-inset-left) + 16px));
}
/* Auto block margins center the card only when it fits. On shorter iPad
   viewports they collapse to zero, keeping both the top and bottom reachable
   from the scroll container instead of centering either edge out of view. */
.overlay.setupMode .setupCard,.overlay.outcomeMode .outcomeCard{flex:none; margin-block:auto; margin-inline:0;}
body.reviewing #stage{display:flex;padding-bottom:2px;}
body.reviewing #board{min-height:0;}
body.reviewing #side{display:block;flex-basis:232px;padding:12px 10px;overflow:hidden;}
body.reviewing #side > :not(#overlay){display:none;}
body.reviewing #reviewTimelineDock{
  display:block;flex:0 0 84px;margin:0 8px 8px;padding:10px 18px 7px;
  border:1px solid rgba(70,38,12,.8);border-radius:12px;
  background:linear-gradient(180deg,rgba(42,27,17,.96),rgba(22,14,9,.98));
  box-shadow:inset 0 1px 0 rgba(255,235,200,.08),0 5px 14px rgba(0,0,0,.32);
}
.overlay.reviewMode{
  position:static; inset:auto; width:100%; height:100%; min-width:0;
  display:block; background:transparent; backdrop-filter:none; pointer-events:none; padding:0;
}
.overlay.reviewMode .reviewHud{pointer-events:auto;margin:0;height:100%;}
.overlay[hidden]{display:none;}
.modalCard{background:#241a12; border:1px solid rgba(255,220,170,.16); border-radius:18px; padding:30px 34px;
  max-width:400px; width:100%; box-shadow:0 18px 60px rgba(0,0,0,.6); text-align:center;}
.modalCard h2{margin:0 0 10px; font-size:22px;}
.modalCard p{margin:8px 0; font-size:16px; line-height:1.55; color:#f2e7d0;}
.modalCard p.dim{color:#b7a183; font-size:14px;}
.btnOkay{padding:13px 54px; font-size:16px; margin-top:16px;}
.menuList .pbtn{margin:10px 0;}
/* ---------- setup screen ---------- */
.setupCard{background:#f3e6c8; border-radius:16px; overflow:hidden; max-width:520px; width:100%;
  box-shadow:0 18px 60px rgba(0,0,0,.6);}
.woodHead{
  background:linear-gradient(180deg,#8a4a24,#5c2d12); padding:12px 14px 18px;
  display:grid; grid-template-columns:1fr auto 1fr; grid-template-rows:auto auto;
  column-gap:8px; row-gap:10px; align-items:start; text-align:center;
  box-shadow:inset 0 -4px 12px rgba(0,0,0,.35);
}
.title3d{
  grid-column:1 / -1; grid-row:2; justify-self:stretch; min-width:0; max-width:100%;
  margin:0; padding:.08em .14em .1em; white-space:nowrap;
  font-family:Georgia,'Times New Roman',serif; font-weight:800; line-height:1.12;
  font-size:clamp(34px,7.4vw,52px); letter-spacing:.045em; color:#f5b98c;
  text-align:center;
  text-shadow:0 1px 0 #a3552a, 0 2px 0 #8a421f, 0 3px 0 #6e3013, 0 4px 0 #54240b, 0 6px 14px rgba(0,0,0,.6);
}
.headBtn{position:static; padding:10px 22px; font-size:14px;}
.headBtn.past{justify-self:start;padding-inline:13px;font-size:12px;white-space:nowrap;}
.headBtn.start{justify-self:end;grid-column:3;}
.setupBody{padding:18px 20px 22px;}
.nameRow{display:flex; align-items:center; gap:10px; margin:12px 0;}
.colorBtn{width:52px; height:52px; border-radius:50%; border:3px solid #7a5a34; cursor:pointer; flex:none;
  box-shadow:0 3px 8px rgba(0,0,0,.3), inset 0 2px 3px rgba(255,255,255,.3);}
.colorBtn.black{background:radial-gradient(circle at 39% 34%, #454a54, #242831 78%);}
.colorBtn.white{background:radial-gradient(circle at 39% 34%, #f6f2e9, #d5ccbd 80%);}
.colorChoice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;}
.colorChoice::before{content:"";width:26px;height:26px;border-radius:50%;border:2px solid #8b704a;box-shadow:inset 0 1px 2px rgba(255,255,255,.35),0 2px 4px rgba(70,40,15,.2);}
.colorChoice[data-color="white"]::before{background:radial-gradient(circle at 39% 34%,#f6f2e9,#d5ccbd 80%);}
.colorChoice[data-color="black"]::before{background:radial-gradient(circle at 39% 34%,#454a54,#242831 78%);}
.colorChoice.sel::before{border-color:#fff3c4;box-shadow:0 0 0 2px rgba(255,209,46,.5),inset 0 1px 2px rgba(255,255,255,.35);}
.fieldWrap{flex:1;}
.fieldWrap label{display:block; font-size:11px; font-weight:800; letter-spacing:.12em; color:#8a6a3c; margin-bottom:3px;}
.fieldWrap input{
  width:100%; border:2px solid #c8a86e; background:#fff; border-radius:12px; padding:10px 14px;
  font-size:16px; font-weight:600; color:#3a2a14; outline:none;
}
.fieldWrap input:focus{border-color:var(--red);}
.swapBtn{border:2px solid #c8a86e; background:#fff; border-radius:10px; width:44px; height:44px; font-size:18px;
  cursor:pointer; color:#8a6a3c; flex:none; line-height:1;}
.setRow{margin:18px 0 6px;}
.setRow .setLabel{font-size:13px; font-weight:800; letter-spacing:.14em; color:#8a6a3c; margin-bottom:8px;}
.pillRow{display:flex; gap:8px; flex-wrap:wrap;}
.pillRow.difficultyRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
.pillRow.difficultyRow .pill{width:100%;min-width:0;}
.pill{flex:1 1 auto; appearance:none; border:1px solid #ad8a4c; background:linear-gradient(180deg,#fffef9,#f4ead7); color:#755528; border-radius:9px; padding:10px 6px;
  box-shadow:0 2px 4px rgba(80,47,11,.16),inset 0 1px 0 #fff;
  text-shadow:0 1px 0 #fff; font-family:inherit; font-size:14px; font-weight:850; letter-spacing:.025em; cursor:pointer; text-align:center;
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;}
.pill.sel{background:linear-gradient(180deg,#e35a40 0%,#c93625 48%,#9e2016 100%); border-color:#7f2116; color:#fff8ee;
  box-shadow:0 4px 9px rgba(94,28,17,.34),inset 0 1px 0 rgba(255,255,255,.28);text-shadow:0 1px 1px rgba(70,15,8,.8);}
.pill:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(80,47,11,.18);}
.tierPill{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;padding:8px 6px;line-height:1.1;}
.tierPill .tierName{font-size:14px;}
.setupNote{text-align:center; color:#8a6a3c; font-size:12.5px; margin-top:16px;}
.helpList{margin:10px 0; padding-left:20px; color:#f2e7d0; font-size:14.5px; line-height:1.6; text-align:left;}
.helpList li{margin:7px 0;}
/* ---------- svg board ---------- */
.bearFlight{
  position:fixed; z-index:58; pointer-events:none; overflow:visible;
  filter:drop-shadow(0 5px 5px rgba(30,15,5,.42));
  transform-origin:center; will-change:transform;
}
.checker{
  transition-property:transform;
  transition-duration:var(--checker-move-ms, 1200ms);
  transition-delay:var(--checker-move-delay, 0ms);
  transition-timing-function:cubic-bezier(.22,.61,.36,1);
  filter:url(#fDrop); cursor:pointer; will-change:transform;
}
#gCK.noMotion .checker{transition:none;}
@media (prefers-reduced-motion: reduce){
  .checker{transition-duration:.01ms !important;transition-delay:0ms !important;}
  .srcRing,.selRing,.destChip,.tumbl{animation:none !important;}
}
.checker .ck-side{stroke:rgba(26,20,15,.42); stroke-width:1.5;}
.checker.w .ck-side{fill:#c5bcad;}
.checker.b .ck-side{fill:#1c2027;}
.checker .ck-edge{fill:none; stroke-width:2.2;}
.checker .ck-face{filter:url(#fTexture);}
.checker.w .ck-face{fill:url(#gCkW);}
.checker.w .ck-edge{stroke:#c7c0b4;}
.checker.w .ck-rim{stroke:#aaa9a5;}
.checker.b .ck-face{fill:url(#gCkB);}
.checker.b .ck-edge{stroke:#20242c;}
.checker.b .ck-rim{stroke:#a1a5ac;}
.checker .ck-rim{fill:none; stroke-width:1.8;}
.checker .ck-groove{fill:none; stroke:rgba(22,20,17,.12); stroke-width:.8;}
.checker .ck-shine{fill:none; stroke:rgba(255,255,255,.12); stroke-width:1.25; stroke-linecap:round;}
.checker .ck-top{fill:url(#gCkTop);}
.tri{stroke:rgba(74,45,25,.18); stroke-width:.8;}
.tri-a{fill:var(--tri-a);} .tri-b{fill:var(--tri-b);}
.wm{font-family:Georgia,'Times New Roman',serif; font-weight:700; fill:rgba(111,74,38,.10); letter-spacing:.10em;}

<script>
"use strict";
/* ================= utils ================= */
const $=id=>document.getElementById(id);
const ORIENTATION_PAUSE={blocked:false,resumeWaiters:[],pauseWaiters:new Set(),animations:[]};
function waitForLandscape(){
  if(!ORIENTATION_PAUSE.blocked)return Promise.resolve();
  return new Promise(resolve=>ORIENTATION_PAUSE.resumeWaiters.push(resolve));
}
async function sleep(ms){
  let remaining=Math.max(0,Number(ms)||0);
  await waitForLandscape();
  while(remaining>0){
    const started=performance.now();
    const elapsed=await new Promise(resolve=>{
      let done=false;
      const finish=()=>{if(done)return;done=true;clearTimeout(timer);ORIENTATION_PAUSE.pauseWaiters.delete(onPause);resolve(performance.now()-started);};
      const onPause=()=>finish();
      const timer=setTimeout(finish,remaining);
      ORIENTATION_PAUSE.pauseWaiters.add(onPause);
    });
    remaining=Math.max(0,remaining-elapsed);
    if(remaining>0)await waitForLandscape();
  }
}
const randInt=n=>Math.floor(Math.random()*n);
/* ================= audio ================= */
const Snd={
  ctx:null,on:true,lastGesture:0,resumePending:null,
  createContext(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    const c=new AC();
    this.ctx=c;
    c.addEventListener('statechange',()=>{
      if(this.ctx!==c)return;
      if(c.state==='closed'){
        this.ctx=null;this.resumePending=null;
        return;
      }
      // iPad Safari can move a healthy context to "interrupted" after the app
      // loses focus. Resume immediately when a recent gesture makes that legal.
      if(!ORIENTATION_PAUSE.blocked&&(c.state==='suspended'||c.state==='interrupted')&&document.visibilityState!=='hidden'&&performance.now()-this.lastGesture<1800){
        this.resume(c,true);
      }
    });
    return c;
  },
  prime(c){
    if(!c||c.state==='closed')return;
    try{
      // Starting a silent source inside the gesture is the most reliable iOS
      // Web Audio unlock. Keep it on the shared context; never create throwaway
      // contexts for individual effects.
      const b=c.createBuffer(1,1,22050),s=c.createBufferSource(),g=c.createGain();
      s.buffer=b;g.gain.value=0;s.connect(g);g.connect(c.destination);s.start(0);
    }catch(e){}
  },
  resume(c,fromGesture){
    if(ORIENTATION_PAUSE.blocked||!c||c.state==='closed')return;
    if(c.state==='running'){
      if(fromGesture)this.prime(c);
      return;
    }
    if(this.resumePending&&!fromGesture)return this.resumePending;
    try{
      const p=c.resume();
      if(p&&typeof p.then==='function'){
        const pending=p.then(()=>{
          if(this.resumePending===pending)this.resumePending=null;
          if(this.ctx===c&&fromGesture)this.prime(c);
        }).catch(()=>{if(this.resumePending===pending)this.resumePending=null;});
        this.resumePending=pending;
        return pending;
      }
      if(fromGesture)this.prime(c);
    }catch(e){this.resumePending=null;}
  },
  ensure(fromGesture){
    if(!this.on||ORIENTATION_PAUSE.blocked)return this.ctx;
    if(fromGesture)this.lastGesture=performance.now();
    try{
      let c=this.ctx;
      if(!c||c.state==='closed')c=this.createContext();
      if(!c)return null;
      this.resume(c,!!fromGesture);
      return c;
    }catch(e){return null;}
  },
  tone(freq,dur,type,vol,slideTo,delay){
    if(!this.on)return; this.ensure();
    const c=this.ctx; if(!c)return;
    const t=c.currentTime+(delay||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol,delay,hp){
    if(!this.on)return; this.ensure();
    const c=this.ctx; if(!c)return;
    const t=c.currentTime+(delay||0);
    const n=Math.max(1,Math.floor(c.sampleRate*dur));
    const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource(); src.buffer=buf;
    const g=c.createGain(); g.gain.value=vol||0.1;
    src.connect(g);
    if(hp){const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;g.connect(f);f.connect(c.destination);}
    else g.connect(c.destination);
    src.start(t);
  },
  diceImpact(delay,force,pitch){
    if(!this.on)return; this.ensure();
    const c=this.ctx;if(!c)return;
    const t=c.currentTime+delay;
    const dur=.075,n=Math.max(1,Math.floor(c.sampleRate*dur));
    const buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++){
      const x=i/n;
      d[i]=(Math.random()*2-1)*Math.exp(-x*18);
    }

function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function glideDieGroup(d,to,duration){
  const from={x:d.x,y:d.y};let start=performance.now(),pausedAt=null;
  return new Promise(resolve=>{
    function frame(now){
      if(ORIENTATION_PAUSE.blocked){
        if(pausedAt===null)pausedAt=now;
        requestAnimationFrame(frame);return;
      }
      if(pausedAt!==null){start+=now-pausedAt;pausedAt=null;}
      const q=Math.min(1,(now-start)/duration),e=easeOutCubic(q);
      d.x=from.x+(to[0]-from.x)*e;d.y=from.y+(to[1]-from.y)*e;

    }

  });

async function revealDouble(value){
  // Let the genuine two-die cast read first; then quietly expand the pair to
  // the four playable dice. This avoids implying that four dice were thrown.
  await sleep(260);
  const pos4=dieRestPositions(4),old=diceEls.slice(0,2);
  const left=makeDie(value,pos4[0][0],pos4[0][1]);
  const right=makeDie(value,pos4[3][0],pos4[3][1]);
  left.inner.style.opacity='0';right.inner.style.opacity='0';
  left.inner.style.transform='translate(42px,0) scale(.76)';
  right.inner.style.transform='translate(-42px,0) scale(.76)';
  diceEls=[left,old[0],old[1],right];
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    old[0].x=pos4[1][0];old[0].y=pos4[1][1];old[0].g.setAttribute('transform',`translate(${old[0].x},${old[0].y})`);
    old[1].x=pos4[2][0];old[1].y=pos4[2][1];old[1].g.setAttribute('transform',`translate(${old[1].x},${old[1].y})`);
    left.inner.style.cssText='';right.inner.style.cssText='';return;
  }
  const fadeOpts={duration:MOTION.doubleReveal,easing:'cubic-bezier(.22,.61,.36,1)',fill:'both'};
  const a=left.inner.animate([{opacity:0,transform:'translate(42px,0) scale(.76)'},{opacity:1,transform:'translate(0,0) scale(1)'}],fadeOpts);
  const b=right.inner.animate([{opacity:0,transform:'translate(-42px,0) scale(.76)'},{opacity:1,transform:'translate(0,0) scale(1)'}],fadeOpts);
  await Promise.all([glideDieGroup(old[0],pos4[1],MOTION.doubleReveal),glideDieGroup(old[1],pos4[2],MOTION.doubleReveal)]);
  a.cancel();b.cancel();left.inner.style.cssText='';right.inner.style.cssText='';
}
function diceFlightPath(i,actor,bounceCount,collision){
  const side=actor==='computer'?-1:actor==='human'?1:(i%2? -1:1);
  // Short, controlled cast: enough lift to read as a throw without the dice
  // leaping across the whole board or rebounding unnaturally high.
  const launchY=side*(128+randInt(28));
  const launchX=(i===0?-1:1)*(72+randInt(34));
  const apex=-(58+randInt(28))*side;
  const drift=(randInt(55)-27);
  const turn=(i===0?1:-1)*(330+randInt(170));
  const meetX=collision?(i===0?32:-32):drift;
  const path=[
    {offset:0,transform:`translate(${launchX}px,${launchY}px) rotate(${turn*.18}deg) scale(.86)`},
    {offset:.30,transform:`translate(${meetX}px,${apex}px) rotate(${turn*.47}deg) scale(1.04)`,easing:'cubic-bezier(.2,.74,.45,1)'},
    {offset:.57,transform:`translate(${drift*.25}px,0) rotate(${turn*.73}deg) scale(1)`}
  ];
  if(bounceCount===2){
    path.push({offset:.75,transform:`translate(${-drift*.14}px,${-side*(20+randInt(13))}px) rotate(${turn*.89}deg)`,easing:'cubic-bezier(.18,.7,.45,1)'});
    path.push({offset:.88,transform:`translate(${drift*.05}px,0) rotate(${turn*.97}deg)`});
  }
  path.push({offset:1,transform:`translate(0,0) rotate(${turn}deg)`});
  return path;
}
async function tumbleDice(values,durMs,actor){
  const duration=durMs||1000;
  // A physical throw is always two dice. Doubles are expanded only after both
  // cast dice have landed, by revealDouble().
  showDice(values.map(()=>1+Math.floor(Math.random()*6)));
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){await sleep(40);setDiceValues(values);return;}
  const extraBounce=randInt(2); // exactly three audible/visible board contacts across the pair
  const bounces=[extraBounce===0?2:1,extraBounce===1?2:1];
  const collision=Math.random()<.42;
  const pitch=(Math.random()-.5)*.42;
  const impacts=[];
  bounces.forEach((n,i)=>{
    impacts.push(duration*(.57+i*.025)/1000);
    if(n===2)impacts.push(duration*(.88+i*.018)/1000);
  });
  impacts.sort((a,b)=>a-b);
  Snd.diceCast(impacts,collision?duration*.32/1000:null,pitch);
  const animations=diceEls.map((d,i)=>{
    d.inner.style.transformBox='fill-box';d.inner.style.transformOrigin='center';
    const path=diceFlightPath(i,actor||'human',bounces[i],collision);
    return typeof d.inner.animate==='function'?d.inner.animate(path,{duration,easing:'linear',fill:'both'}):null;
  });
  // Faces change only while the dice are airborne or rebounding. The final
  // face is installed before the last quiet settle, so it never cycles in place.
  const tumbleEnd=performance.now()+duration-120;
  while(performance.now()<tumbleEnd){
    await sleep(72+randInt(22));
    setDiceValues(values.map(()=>1+Math.floor(Math.random()*6)));
  }
  setDiceValues(values);
  await sleep(Math.max(0,tumbleEnd+120-performance.now()));
  animations.forEach(a=>{if(a)a.cancel();});
  setDiceValues(values);
}

function resignProbs(){
  // [P(human loses single), P(loses gammon), P(loses backgammon)], or null if unscorable.
  try{
    const g=window.GNUbgEvaluator;
    if(!(g&&g.ready))return null;
    const r=g.evaluate(toGNUBoard(GAME.state,GAME.sideHuman));
    if(!r)return null;
    const pBack=Math.max(0,r.loseBackgammon||0);
    const pGam=Math.max(0,r.loseGammon||0);
    const pWin=Math.min(1,Math.max(0,r.win||0));
    const pSingle=Math.max(0,(1-pWin)-pGam-pBack);
    return [pSingle,pGam,pBack];
  }catch(e){return null;}
}

function fullscreenElement(){

function isFullscreen(){return !!fullscreenElement()||document.webkitIsFullScreen===true;}
function fullscreenTarget(){

  // reliable whole-page target in iPad Safari and keeps every dialog inside.

function fullscreenAvailable(){
  const root=fullscreenTarget();

  const hasRequest=typeof root.webkitRequestFullscreen==='function'||typeof root.requestFullscreen==='function';
  const policyAllows=document.webkitFullscreenEnabled!==false&&document.fullscreenEnabled!==false;
  return hasRequest&&policyAllows;

function syncFullscreenToggle(){

    control.classList.toggle('on',on);

    else control.setAttribute('aria-pressed',String(on));

function fullscreenFailed(error){
  fullscreenPending=false;
  clearTimeout(fullscreenCheckTimer);
  fullscreenControls().forEach(control=>control.removeAttribute('aria-busy'));
  syncFullscreenToggle();

  toast('Fullscreen was blocked by Safari. Tap the switch again.',2600);

function toggleFS(){
  // Keep the API call synchronous with the trusted tap. In particular, do not
  // await, play audio, or close the menu before calling WebKit on iPad Safari.
  if(fullscreenPending)return;
  const root=fullscreenTarget();
  if(!root){fullscreenFailed();return;}
  fullscreenPending=true;
  fullscreenControls().forEach(control=>control.setAttribute('aria-busy','true'));
  try{
    let result;
    if(!isFullscreen()){
      // iPad Safari exposes the prefixed API; standards-based browsers use the
      // fallback. The method is called with its owning element as `this`.
      if(typeof root.webkitRequestFullscreen==='function')result=root.webkitRequestFullscreen();
      else if(typeof root.requestFullscreen==='function')result=root.requestFullscreen({navigationUI:'hide'});
      else{fullscreenFailed();return;}
    }else{
      if(typeof document.webkitExitFullscreen==='function')result=document.webkitExitFullscreen();
      else if(typeof document.exitFullscreen==='function')result=document.exitFullscreen();
      else{fullscreenFailed();return;}
    }
    if(result&&typeof result.then==='function')result.then(syncFullscreenToggle).catch(fullscreenFailed);
    // Legacy WebKit returns void; its change/error event normally resolves the
    // state. The delayed check prevents a rejected request from looking dead.
    fullscreenCheckTimer=setTimeout(()=>{
      if(fullscreenPending){
        if(isFullscreen())syncFullscreenToggle();
        else fullscreenFailed();
      }
    },900);
  }catch(e){fullscreenFailed(e);}
}
function wireFullscreenControl(control){
  if(!control)return;
  // Use touchend directly on iPad so the WebKit call remains inside the same
  // touch gesture. preventDefault suppresses the later synthetic click.
  control.addEventListener('touchend',e=>{
    if(control.disabled)return;
    e.preventDefault();
    fullscreenTouchHandled=true;
    toggleFS();
    Snd.pick();
    setTimeout(()=>{fullscreenTouchHandled=false;},500);
  },{passive:false});
  control.addEventListener('click',()=>{
    if(fullscreenTouchHandled||control.disabled)return;
    toggleFS();
    Snd.pick();
  });
}

function bearOffChoice(){
  if(GAME.phase!=='moving')return null;
  const selected=GAME.destsNow.find(d=>d.to==='off');
  if(selected)return selected;
  // Derive the available bear-off from the current position and remaining dice
  // instead of trusting a sequence cache that may still describe the prior
  // position for a frame after an animated move or Undo.
  const currentSeqs=GAME.state?legalSequences(GAME.state,GAME.sideHuman,GAME.remaining):[];
  for(const seq of currentSeqs){
    if(!seq.length)continue;
    // Prefer a complete consecutive route for one checker, including a legal
    // two-die or doubles route whose final step bears it off.
    const moves=[];
    let expectedFrom=seq[0].from;
    for(const move of seq){
      if(move.from!==expectedFrom)break;
      moves.push(move);
      if(move.to==='off')return Object.assign({},move,{moves:moves.slice(),compound:moves.length>1});
      expectedFrom=move.to;
    }
  }
  return null;
}

async function aiTurn(openingDice){
  GAME.phase='ai';syncUI();clearHL();
  const tok=GAME.token;
  await sleep(900);if(tok!==GAME.token)return;
  let dice;
  if(openingDice){dice=openingDice;showDice(dice);}
  else{
    const cast=rollPair();dice=playableDice(cast);clearDice();
    await tumbleDice(cast,MOTION.diceTurn,'computer');
    if(tok!==GAME.token)return;
    if(cast[0]===cast[1]){await revealDouble(cast[0]);if(tok!==GAME.token)return;}
  }
  if(tok!==GAME.token)return;
  // Keep the state snapshot internally consistent with the dice shown for the
  // computer. (Previously this still held the player's prior roll.) Undo now
  // has a complete turn boundary even though returning to preroll clears it.
  GAME.diceVals=dice.slice();GAME.remaining=[];
  const aiUndo=historySnapshot('computer-turn');
  startTurnRecord(GAME.sideAI,dice);
  const aiBefore=cloneState(GAME.state);
  const tier=AI_TIERS[GAME.difficulty]||AI_TIERS.medium;
  await ensureGNUReady(tier.label+' computer');
  if(tok!==GAME.token)return;
  let seq;
  if(GAME.difficulty==='hard'){
    // WASM gnubg: real engine at native speed (~100ms 2-ply). Falls back to
    // the JS hybrid, then 1-ply, if WASM is unavailable. A hard timeout
    // guarantees the turn never stalls, even if the search hangs.
    startThinkIndicator();
    try{
      seq=await Promise.race([
        aiPickWasm(GAME.state,dice,GAME.sideAI),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('hard think timeout')),9000)),
      ]);
    }
    catch(e){
      try{
        seq=await Promise.race([
          aiPickHardHybrid(GAME.state,dice,GAME.sideAI),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error('hard think timeout')),9000)),
        ]);
      }catch(e2){seq=aiPick(GAME.state,dice,GAME.sideAI,GAME.difficulty);}
    }
    stopThinkIndicator();
  }else{
    seq=aiPick(GAME.state,dice,GAME.sideAI,GAME.difficulty);
  }
  if(tok!==GAME.token)return;
  if(!seq.length){
    recordTurn(GAME.sideAI,dice,[],aiBefore,GAME.state);
    showAiNoMoveDialog(tok,false);
    return;
  }
  // One history step represents the computer's complete turn, even when the
  // roll produces several checker movements. The next Undo therefore returns
  // to the player's just-finished turn; subsequent presses walk that turn
  // backward one checker at a time.
  GAME.history.push(aiUndo);syncUI();
  const dimd=new Set();
  for(const m of seq){
    const movingId=movingCheckerId(GAME.state,m,GAME.sideAI);
    const hitId=m.hit?GAME.state.points[m.to][GAME.state.points[m.to].length-1]:null;
    GAME.state=applyMove(GAME.state,m,GAME.sideAI);GAME.turnMoves.push(Object.assign({},m));

    if(hitId&&CK[hitId])toFront(CK[hitId]);
    for(let i=0;i<diceEls.length;i++){
      if(!dimd.has(i)&&diceEls[i].val===m.die){dimd.add(i);dimDie(i);break;}
    }
    const motion=animateMoveLayout(st,m,movingId,hitId,'computer');
    if(m.to!=='off')updatePanel();
    if(m.hit)Snd.hit(motion.moveMs,motion.barDelayMs,motion.barMoveMs);
    else if(m.to==='off')Snd.bear(motion.moveMs);
    else Snd.place(motion.moveMs);
    await sleep(motion.totalMs+MOTION.settle);
    if(tok!==GAME.token)return;

  const dock=$('reviewTimelineDock');

  $('oReview').onclick=()=>{Snd.btn();const first=keyMoments()[0];showReplay(first?first.recordIndex:0,true);};

async function showResultDialog(){

function resignLabel(pts){return pts>=3?'resigned backgammon':pts===2?'resigned gammon':'resigned single';}
function endGame(winner,opts){
  opts=opts||{};
  finishCurrentTurnRecord();GAME.phase='over';bumpToken();clearHL();syncUI();
  const resignPts=opts.resigned?(opts.resignPoints||1):0;
  const info=opts.resigned?{mult:resignPts,label:resignLabel(resignPts)}:gammonInfo(GAME.state,winner);
  const pts=info.mult;updatePanel();
  let resultDelay=700;
  if(winner===GAME.sideHuman){Snd.win();resultDelay=celebrateVictory()||resultDelay;}else Snd.lose();
  const wname=winner===GAME.sideHuman?GAME.nameYou:GAME.nameOpp;
  GAME.lastResult={winner,name:wname,points:pts,state:cloneState(GAME.state),info,resigned:!!opts.resigned};
  const won=winner===GAME.sideHuman;
  GAME.pastGames.unshift({
    record:JSON.parse(JSON.stringify(GAME.record)),lastResult:JSON.parse(JSON.stringify(GAME.lastResult)),
    nameYou:'You',nameOpp:'Computer',sideHuman:GAME.sideHuman,sideAI:GAME.sideAI,
    diffKey:GAME.difficulty,diffLabel:(AI_TIERS[GAME.difficulty]||{}).label||GAME.difficulty,
    resultLabel:opts.resigned?'You resigned':(won?'You won':'Computer won'),scoreLabel:`${pts} point${pts===1?'':'s'} · ${info.label}`,
    dateLabel:new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date())
  });
  if(GAME.pastGames.length>10)GAME.pastGames.length=10;
  sleep(resultDelay).then(()=>{if(GAME.phase==='over')showResultDialog();});
}
/* ---------- orientation gate ---------- */
const orientationMedia=window.matchMedia?window.matchMedia('(orientation: portrait)'):null;
function portraitViewport(){
  return orientationMedia?orientationMedia.matches:window.innerHeight>window.innerWidth;
}
function syncOrientationGate(){
  const blocked=portraitViewport(),gate=$('orientationGate'),app=$('app');
  if(blocked===ORIENTATION_PAUSE.blocked){
    gate.hidden=!blocked;
    document.body.classList.toggle('portrait-blocked',blocked);
    return;
  }
  ORIENTATION_PAUSE.blocked=blocked;
  gate.hidden=!blocked;
  document.body.classList.toggle('portrait-blocked',blocked);
  app.toggleAttribute('inert',blocked);
  app.setAttribute('aria-hidden',String(blocked));
  if(blocked){
    if(DRAG.id)dragCleanup();
    ORIENTATION_PAUSE.animations=[];
    if(typeof document.getAnimations==='function'){
      document.getAnimations().forEach(animation=>{
        if(animation.playState==='running'){
          try{animation.pause();ORIENTATION_PAUSE.animations.push(animation);}catch(e){}
        }
      });
    }
    ORIENTATION_PAUSE.pauseWaiters.forEach(notify=>notify());
    if(Snd.ctx&&Snd.ctx.state==='running'){
      try{Snd.ctx.suspend();}catch(e){}
    }
    requestAnimationFrame(()=>gate.focus({preventScroll:true}));
  }else{
    const animations=ORIENTATION_PAUSE.animations.splice(0);
    animations.forEach(animation=>{try{if(animation.playState==='paused')animation.play();}catch(e){}});
    const waiters=ORIENTATION_PAUSE.resumeWaiters.splice(0);
    waiters.forEach(resolve=>resolve());
    if(Snd.ctx&&Snd.ctx.state!=='closed')Snd.resume(Snd.ctx,false);
    requestAnimationFrame(refreshBoardFit);
  }
}

function init(){
  syncOrientationGate();
  if(window.GNUbgEvaluator)GNUbgEvaluator.load();
  buildBoard();
  buildCheckers();
  GAME.state=newState();
  layout(GAME.state);
  updatePanel();
  svg.addEventListener('pointerdown',onDown);
  svg.addEventListener('keydown',onBoardKey);
  // The HTML overlay is outside the SVG, so board move handling cannot steal
  // its tap. A native button also supplies Enter/Space activation on its own.
  btnRoll.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();
    if(GAME.phase!=='preroll')return;
    Snd.ensure();Snd.btn();onRoll();
  });
  const refreshLayout=()=>{syncOrientationGate();requestAnimationFrame(refreshBoardFit);};
  window.addEventListener('resize',refreshLayout,{passive:true});
  window.addEventListener('orientationchange',refreshLayout,{passive:true});
  if(orientationMedia){
    if(typeof orientationMedia.addEventListener==='function')orientationMedia.addEventListener('change',refreshLayout);
    else if(typeof orientationMedia.addListener==='function')orientationMedia.addListener(refreshLayout);
  }
  $('badgeYou').addEventListener('click',()=>{Snd.ensure();onOffTap();});
  $('btnUndo').addEventListener('click',()=>{onUndo();});
  $('btnMenu').addEventListener('click',()=>{Snd.btn();openMenu();});
  svg.addEventListener('contextmenu',e=>e.preventDefault());
  refreshIdentity();

}
