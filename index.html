<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1512" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#d9c9a4" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="icon" href="data:," />
<title>Backgammon</title>
<style>
:root{
  color-scheme: light dark;
  --room1:#2b170a; --room2:#120906;
  --frame1:#9a542d; --frame2:#633114;
  --felt1:#d8b77b; --felt2:#c99b5e;
  --bar1:#955a32; --bar2:#70401f;
  --tri-a:#ead29b; --tri-b:#a15443;
  --ink:#f6e8cf; --muted:#c8ae85;
  --gold:#ffd12e; --red:#c33a24; --red2:#e0644f;
  --w-face1:#f4f0e8; --w-face2:#d8d0c1; --w-ring:#b7b4ad;
  --b-face1:#414650; --b-face2:#242932; --b-ring:#969ba3;
  --card:#1d150e; --panel-b:rgba(255,220,170,.14);
  --toast:#241a10; --toast-ink:#ffe9c9;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1300px 850px at 45% 30%, var(--room1), var(--room2));
  overflow:hidden; height:100dvh;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
#app{height:100dvh; display:flex; align-items:stretch;}
/* Portrait is a hard stop rather than an alternate game layout. The gate lives
   outside #app so the board, dialogs and all controls can be hidden and made
   inert without disturbing their landscape geometry or in-progress state. */
#orientationGate{
  position:fixed; inset:0; z-index:1000; display:none;
  align-items:center; justify-content:center; overflow:hidden;
  padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right))
          max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  background:
    radial-gradient(ellipse at 50% 38%,rgba(159,98,50,.24),transparent 54%),
    linear-gradient(145deg,#2b170a,#100805 72%);
  color:#f6e8cf; text-align:center;
}
body.portrait-blocked #orientationGate{display:flex;}
body.portrait-blocked #app,
body.portrait-blocked > #overlay,
body.portrait-blocked #toast,
body.portrait-blocked .bearFlight{
  visibility:hidden!important; pointer-events:none!important;
}
.orientationPrompt{max-width:430px;}
.orientationDevice{
  width:136px; height:88px; margin:0 auto 26px; position:relative;
  border:7px solid #dca06b; border-radius:17px;
  background:linear-gradient(135deg,#d8b77b 0 50%,#a15443 50% 100%);
  box-shadow:0 12px 28px rgba(0,0,0,.38),inset 0 0 0 4px #43210e;
}
.orientationDevice::after{
  content:""; position:absolute; right:4px; top:50%; width:5px; height:5px;
  border-radius:50%; background:#5c2d12; transform:translateY(-50%);
}
.orientationPrompt h1{
  margin:0 0 10px; color:#fff3dd;
  font:800 clamp(27px,7vw,38px)/1.12 Georgia,'Times New Roman',serif;
  letter-spacing:.01em;
}
.orientationPrompt p{margin:0;color:#d8c5a6;font-size:clamp(15px,4vw,18px);line-height:1.45;}
@media (orientation:portrait){
  #orientationGate{display:flex;}
}
html:fullscreen,html:-webkit-full-screen,html:fullscreen body,html:-webkit-full-screen body,
html:fullscreen #app,html:-webkit-full-screen #app,#app:fullscreen,#app:-webkit-full-screen{
  width:100%;height:100%;background:radial-gradient(1300px 850px at 45% 30%, var(--room1), var(--room2));
}
#playArea{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;}
/* ---------- board stage ---------- */
#stage{flex:1 1 auto; min-width:0; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px; position:relative;}
#reviewTimelineDock{display:none;}
#board{width:100%; height:100%; touch-action:none; cursor:pointer; outline:none;}
#btnRoll{
  position:absolute; z-index:18; margin:0; padding:0; width:108px; height:39px;
  transform:translate(-50%,-50%); pointer-events:auto; touch-action:manipulation;
}
#btnRoll[hidden]{display:none;}
#confetti{
  position:absolute; inset:0; z-index:45; pointer-events:none; overflow:hidden;
}
#confetti[hidden]{display:none;}
.confettiPiece{
  position:absolute; top:-28px; left:var(--left); width:var(--w); height:var(--h);
  border-radius:var(--radius); background:var(--c); opacity:0;
  transform-origin:center; will-change:transform,opacity;
  animation:confettiFall var(--dur) linear var(--delay) both;
}
.confettiPiece.streamer{height:3px;border-radius:999px;}
.confettiPiece.diamond{border-radius:1px;}
@keyframes confettiFall{
  0%{opacity:0;transform:translate3d(0,-4vh,0) rotate(0deg);}
  4%{opacity:1;}
  28%{transform:translate3d(var(--sway-a),28vh,0) rotate(var(--spin-a));}
  58%{opacity:1;transform:translate3d(var(--sway-b),64vh,0) rotate(var(--spin-b));}
  88%{opacity:1;}
  100%{opacity:0;transform:translate3d(var(--sway-c),112vh,0) rotate(var(--spin-c));}
}
/* ---------- side panel strip ---------- */
#side{
  flex:0 0 176px; display:grid; grid-template-rows:1fr auto 1fr;
  gap:10px; padding:14px 10px; margin-right:10px; align-items:center;
  background:
    linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,235,200,.06), rgba(0,0,0,.28)),
    repeating-linear-gradient(92deg, #b9803f 0 7px, #a97134 7px 14px);
  border-radius:14px; align-self:center; height:calc(100dvh - 28px);
  box-shadow:inset 0 0 24px rgba(60,30,5,.55), 0 8px 22px rgba(0,0,0,.4);
  border:1px solid rgba(70,38,12,.8);
}
.pblk{width:100%; text-align:center; padding:6px 4px;}
#blkHuman{align-self:start;}
#side .mid{align-self:center;}
#blkOpp{align-self:end;}
.offBadge{
  width:64px; height:64px; border-radius:50%; margin:2px auto 8px; padding:0;
  display:flex; align-items:center; justify-content:center;
  appearance:none; font-family:inherit; font-size:26px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;
  border:3px solid var(--gold);
  box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.25);
}
button.offBadge{cursor:default; touch-action:manipulation;}
button.offBadge.ready{
  position:relative; isolation:isolate; cursor:pointer; border-color:#fff08a;
  box-shadow:0 0 0 4px rgba(255,209,46,.54),0 0 22px 9px rgba(255,188,24,.48),0 5px 14px rgba(0,0,0,.5),inset 0 0 12px rgba(255,224,89,.34),inset 0 2px 3px rgba(255,255,255,.35);
  animation:bearReadyPulse 1.25s ease-in-out infinite;
}
button.offBadge.ready::after{
  content:""; position:absolute; inset:-10px; border:3px solid rgba(255,225,91,.88); border-radius:50%;
  pointer-events:none; box-shadow:0 0 12px rgba(255,202,36,.68);
  animation:bearReadyRing 1.25s ease-out infinite;
}
button.offBadge.ready:active{transform:scale(.95);}
@keyframes bearReadyPulse{
  0%,100%{filter:brightness(1);box-shadow:0 0 0 3px rgba(255,209,46,.46),0 0 15px 6px rgba(255,188,24,.38),0 5px 14px rgba(0,0,0,.5),inset 0 0 9px rgba(255,224,89,.26),inset 0 2px 3px rgba(255,255,255,.35);}
  50%{filter:brightness(1.22);box-shadow:0 0 0 6px rgba(255,225,91,.68),0 0 28px 13px rgba(255,188,24,.60),0 5px 14px rgba(0,0,0,.5),inset 0 0 17px rgba(255,232,117,.48),inset 0 2px 3px rgba(255,255,255,.40);}
}
@keyframes bearReadyRing{
  0%{opacity:.95;transform:scale(.82);}
  75%,100%{opacity:0;transform:scale(1.28);}
}
@media (prefers-reduced-motion:reduce){
  button.offBadge.ready,button.offBadge.ready::after{animation:none;}
  button.offBadge.ready::after{opacity:1;transform:none;}
}
.offBadge.black{background:radial-gradient(circle at 39% 34%, #454a54, #242831 78%); color:#fff;}
.offBadge.white{background:radial-gradient(circle at 39% 34%, #f6f2e9, #d5ccbd 80%); color:#2a2118;}
.pname{color:var(--gold); font-weight:800; font-size:17px; letter-spacing:.02em; margin:2px 0 5px;
  text-shadow:0 1px 3px rgba(0,0,0,.5); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pline{color:#fff; font-size:14.5px; font-weight:600; line-height:1.5; text-shadow:0 1px 3px rgba(0,0,0,.55); font-variant-numeric:tabular-nums;}
.pbtn,.headBtn,.btnOkay{
  appearance:none; border:1px solid #7f2116; border-radius:9px; cursor:pointer;
  color:#fff8ee; background:linear-gradient(180deg,#e35a40 0%,#c93625 48%,#9e2016 100%);
  box-shadow:0 5px 11px rgba(35,14,6,.42),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(78,13,8,.5);
  text-shadow:0 1px 1px rgba(70,15,8,.8);
  font-family:inherit; font-weight:850; letter-spacing:.09em;
  transition:filter .12s ease,transform .12s ease,box-shadow .12s ease;
  touch-action:manipulation;
}
.pbtn{
  display:block; width:100%; margin:8px 0; padding:11px 0;
  font-size:14px;
}
.pbtn:active,.headBtn:active,.btnOkay:active{
  transform:translateY(1px);
  filter:saturate(.92) brightness(.96);
  box-shadow:0 2px 5px rgba(35,14,6,.38),inset 0 1px 2px rgba(78,13,8,.35);
}
.pbtn:disabled{opacity:.38;filter:saturate(.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);}
/* ---------- toast ---------- */
#toast{
  position:fixed; left:44%; top:14px; z-index:70; pointer-events:none;
  transform:translate(-50%,-16px); opacity:0; transition:opacity .22s, transform .22s;
  background:var(--toast); color:var(--toast-ink); font-weight:650; font-size:14.5px;
  padding:10px 18px; border-radius:11px; box-shadow:0 8px 20px rgba(0,0,0,.5); max-width:86vw; text-align:center;
}
#toast.show{opacity:1; transform:translate(-50%,0);}
/* ---------- overlays ---------- */
.overlay{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px;
  background:rgba(8,5,3,.66); backdrop-filter:blur(5px);}
.overlay.setupMode,.overlay.outcomeMode{
  flex-direction:column; align-items:center; justify-content:flex-start; overflow-y:auto;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  padding-top:max(24px,calc(env(safe-area-inset-top) + 18px));
  padding-right:max(16px,calc(env(safe-area-inset-right) + 16px));
  padding-bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));
  padding-left:max(16px,calc(env(safe-area-inset-left) + 16px));
}
/* Auto block margins center the card only when it fits. On shorter iPad
   viewports they collapse to zero, keeping both the top and bottom reachable
   from the scroll container instead of centering either edge out of view. */
.overlay.setupMode .setupCard,.overlay.outcomeMode .outcomeCard{flex:none; margin-block:auto; margin-inline:0;}
body.reviewing #stage{display:flex;padding-bottom:2px;}
body.reviewing #board{min-height:0;}
body.reviewing #side{display:block;flex-basis:232px;padding:12px 10px;overflow:hidden;}
body.reviewing #side > :not(#overlay){display:none;}
body.reviewing #reviewTimelineDock{
  display:block;flex:0 0 84px;margin:0 8px 8px;padding:10px 18px 7px;
  border:1px solid rgba(70,38,12,.8);border-radius:12px;
  background:linear-gradient(180deg,rgba(42,27,17,.96),rgba(22,14,9,.98));
  box-shadow:inset 0 1px 0 rgba(255,235,200,.08),0 5px 14px rgba(0,0,0,.32);
}
.overlay.reviewMode{
  position:static; inset:auto; width:100%; height:100%; min-width:0;
  display:block; background:transparent; backdrop-filter:none; pointer-events:none; padding:0;
}
.overlay.reviewMode .reviewHud{pointer-events:auto;margin:0;height:100%;}
.overlay[hidden]{display:none;}
.modalCard{background:#241a12; border:1px solid rgba(255,220,170,.16); border-radius:18px; padding:30px 34px;
  max-width:400px; width:100%; box-shadow:0 18px 60px rgba(0,0,0,.6); text-align:center;}
.modalCard h2{margin:0 0 10px; font-size:22px;}
.modalCard p{margin:8px 0; font-size:16px; line-height:1.55; color:#f2e7d0;}
.modalCard p.dim{color:#b7a183; font-size:14px;}
.btnOkay{padding:13px 54px; font-size:16px; margin-top:16px;}
.menuList .pbtn{margin:10px 0;}
/* ---------- setup screen ---------- */
.setupCard{background:#f3e6c8; border-radius:16px; overflow:hidden; max-width:520px; width:100%;
  box-shadow:0 18px 60px rgba(0,0,0,.6);}
.woodHead{
  background:linear-gradient(180deg,#8a4a24,#5c2d12); padding:12px 14px 18px;
  display:grid; grid-template-columns:1fr auto 1fr; grid-template-rows:auto auto;
  column-gap:8px; row-gap:10px; align-items:start; text-align:center;
  box-shadow:inset 0 -4px 12px rgba(0,0,0,.35);
}
.title3d{
  grid-column:1 / -1; grid-row:2; justify-self:stretch; min-width:0; max-width:100%;
  margin:0; padding:.08em .14em .1em; white-space:nowrap;
  font-family:Georgia,'Times New Roman',serif; font-weight:800; line-height:1.12;
  font-size:clamp(34px,7.4vw,52px); letter-spacing:.045em; color:#f5b98c;
  text-align:center;
  text-shadow:0 1px 0 #a3552a, 0 2px 0 #8a421f, 0 3px 0 #6e3013, 0 4px 0 #54240b, 0 6px 14px rgba(0,0,0,.6);
}
.headBtn{position:static; padding:10px 22px; font-size:14px;}
.headBtn.past{justify-self:start;padding-inline:13px;font-size:12px;white-space:nowrap;}
.headBtn.start{justify-self:end;grid-column:3;}
.setupBody{padding:18px 20px 22px;}
.nameRow{display:flex; align-items:center; gap:10px; margin:12px 0;}
.colorBtn{width:52px; height:52px; border-radius:50%; border:3px solid #7a5a34; cursor:pointer; flex:none;
  box-shadow:0 3px 8px rgba(0,0,0,.3), inset 0 2px 3px rgba(255,255,255,.3);}
.colorBtn.black{background:radial-gradient(circle at 39% 34%, #454a54, #242831 78%);}
.colorBtn.white{background:radial-gradient(circle at 39% 34%, #f6f2e9, #d5ccbd 80%);}
.colorChoice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;}
.colorChoice::before{content:"";width:26px;height:26px;border-radius:50%;border:2px solid #8b704a;box-shadow:inset 0 1px 2px rgba(255,255,255,.35),0 2px 4px rgba(70,40,15,.2);}
.colorChoice[data-color="white"]::before{background:radial-gradient(circle at 39% 34%,#f6f2e9,#d5ccbd 80%);}
.colorChoice[data-color="black"]::before{background:radial-gradient(circle at 39% 34%,#454a54,#242831 78%);}
.colorChoice.sel::before{border-color:#fff3c4;box-shadow:0 0 0 2px rgba(255,209,46,.5),inset 0 1px 2px rgba(255,255,255,.35);}
.fieldWrap{flex:1;}
.fieldWrap label{display:block; font-size:11px; font-weight:800; letter-spacing:.12em; color:#8a6a3c; margin-bottom:3px;}
.fieldWrap input{
  width:100%; border:2px solid #c8a86e; background:#fff; border-radius:12px; padding:10px 14px;
  font-size:16px; font-weight:600; color:#3a2a14; outline:none;
}
.fieldWrap input:focus{border-color:var(--red);}
.swapBtn{border:2px solid #c8a86e; background:#fff; border-radius:10px; width:44px; height:44px; font-size:18px;
  cursor:pointer; color:#8a6a3c; flex:none; line-height:1;}
.setRow{margin:18px 0 6px;}
.setRow .setLabel{font-size:13px; font-weight:800; letter-spacing:.14em; color:#8a6a3c; margin-bottom:8px;}
.pillRow{display:flex; gap:8px; flex-wrap:wrap;}
.pillRow.difficultyRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
.pillRow.difficultyRow .pill{width:100%;min-width:0;}
.pill{flex:1 1 auto; appearance:none; border:1px solid #ad8a4c; background:linear-gradient(180deg,#fffef9,#f4ead7); color:#755528; border-radius:9px; padding:10px 6px;
  box-shadow:0 2px 4px rgba(80,47,11,.16),inset 0 1px 0 #fff;
  text-shadow:0 1px 0 #fff; font-family:inherit; font-size:14px; font-weight:850; letter-spacing:.025em; cursor:pointer; text-align:center;
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;}
.pill.sel{background:linear-gradient(180deg,#e35a40 0%,#c93625 48%,#9e2016 100%); border-color:#7f2116; color:#fff8ee;
  box-shadow:0 4px 9px rgba(94,28,17,.34),inset 0 1px 0 rgba(255,255,255,.28);text-shadow:0 1px 1px rgba(70,15,8,.8);}
.pill:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(80,47,11,.18);}
.tierPill{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;padding:8px 6px;line-height:1.1;}
.tierPill .tierName{font-size:14px;}
.tierPill .tierElo{margin-top:4px;font-size:10.5px;font-weight:650;letter-spacing:.035em;color:#9a7b4b;opacity:.88;}
.tierPill.sel .tierElo{color:#ffe5d7;opacity:.8;text-shadow:none;}
.setupNote{text-align:center; color:#8a6a3c; font-size:12.5px; margin-top:16px;}
.helpList{margin:10px 0; padding-left:20px; color:#f2e7d0; font-size:14.5px; line-height:1.6; text-align:left;}
.helpList li{margin:7px 0;}
/* ---------- svg board ---------- */
.bearFlight{
  position:fixed; z-index:58; pointer-events:none; overflow:visible;
  filter:drop-shadow(0 5px 5px rgba(30,15,5,.42));
  transform-origin:center; will-change:transform;
}
.checker{
  transition-property:transform;
  transition-duration:var(--checker-move-ms, 1200ms);
  transition-delay:var(--checker-move-delay, 0ms);
  transition-timing-function:cubic-bezier(.22,.61,.36,1);
  filter:url(#fDrop); cursor:pointer; will-change:transform;
}
#gCK.noMotion .checker{transition:none;}
@media (prefers-reduced-motion: reduce){
  .checker{transition-duration:.01ms !important;transition-delay:0ms !important;}
  .srcRing,.selRing,.destChip,.tumbl{animation:none !important;}
}
.checker .ck-side{stroke:rgba(26,20,15,.42); stroke-width:1.5;}
.checker.w .ck-side{fill:#c5bcad;}
.checker.b .ck-side{fill:#1c2027;}
.checker .ck-edge{fill:none; stroke-width:2.2;}
.checker .ck-face{filter:url(#fTexture);}
.checker.w .ck-face{fill:url(#gCkW);}
.checker.w .ck-edge{stroke:#c7c0b4;}
.checker.w .ck-rim{stroke:#aaa9a5;}
.checker.b .ck-face{fill:url(#gCkB);}
.checker.b .ck-edge{stroke:#20242c;}
.checker.b .ck-rim{stroke:#a1a5ac;}
.checker .ck-rim{fill:none; stroke-width:1.8;}
.checker .ck-groove{fill:none; stroke:rgba(22,20,17,.12); stroke-width:.8;}
.checker .ck-shine{fill:none; stroke:rgba(255,255,255,.12); stroke-width:1.25; stroke-linecap:round;}
.checker .ck-top{fill:url(#gCkTop);}
.tri{stroke:rgba(74,45,25,.18); stroke-width:.8;}
.tri-a{fill:var(--tri-a);} .tri-b{fill:var(--tri-b);}
.wm{font-family:Georgia,'Times New Roman',serif; font-weight:700; fill:rgba(111,74,38,.10); letter-spacing:.10em;}
.destPoly{fill:rgba(255,209,46,.40); stroke:var(--gold); stroke-width:4; opacity:.95; pointer-events:auto; cursor:pointer;}
.checker.chosen .ck-face{fill:#efb82d;}
.checker.chosen .ck-side{fill:#a86616;stroke:#59340b;}
.checker.chosen .ck-edge{stroke:#fff1a9;stroke-width:3.2;}
.checker.chosen .ck-rim{stroke:#7c4a0f;stroke-width:2.4;}
.checker.chosen .ck-groove{stroke:rgba(62,34,5,.38);}
.destChip{transform-box:fill-box; transform-origin:center; animation:destPulse 1.25s ease-in-out infinite;}
#gHL .destChip{pointer-events:none;}
@keyframes destPulse{0%,100%{transform:scale(1);opacity:.93;}50%{transform:scale(1.15);opacity:1;}}
.die{filter:url(#fDrop);}
.die.used{opacity:.25;}
.tumbl{animation:tumble .28s linear infinite; transform-box:fill-box; transform-origin:center;}
@keyframes tumble{0%{transform:rotate(0deg) translate(0,0);}25%{transform:rotate(35deg) translate(6px,-16px);}
  50%{transform:rotate(-30deg) translate(-5px,-6px);}75%{transform:rotate(25deg) translate(5px,-12px);}100%{transform:rotate(-20deg);}}
.badgeC{fill:rgba(20,12,6,.9);}
.badgeT{fill:#ffe9c9; font-weight:800; font-size:19px; text-anchor:middle; dominant-baseline:central;}
svg text{pointer-events:none;}
/* ---------- landscape (wide) tuning: board gets the real estate ---------- */
@media (orientation: landscape){
  #stage{padding:6px;}
  #side{height:calc(100dvh - 16px); margin-right:8px;}
}
/* tablet-height landscape (e.g. iPad mini): keep the rail compact so the
   taller 4:3 board reaches the same top and bottom edges as the controls. */
@media (orientation: landscape) and (max-height:820px){
  #stage{padding:4px;}
  #side{flex-basis:134px;height:calc(100dvh - 8px);margin-right:4px;padding:10px 8px;gap:6px;border-radius:12px;}
  .offBadge{width:52px; height:52px; font-size:21px;margin-bottom:5px;}
  #side .pname{font-size:15px;margin-bottom:3px;}
  #side .pline{font-size:13px;line-height:1.4;}
  #side .pbtn{min-height:44px;margin:6px 0;padding:9px 0;}
}
/* short landscape (phones / split view): compact rail, controls stay tappable */
@media (orientation: landscape) and (max-height:520px){
  #stage{padding:4px;}

/* Review mode: calm, roomy controls on the right. Secondary analysis stays
   one tap away instead of competing with playback and navigation. */
body.reviewing #side{flex-basis:284px;padding:18px 16px;overflow:hidden;}
.reviewHud{position:relative;padding:0;gap:18px;overflow:visible;}
.reviewHudTop{display:block;padding:0 50px 17px 0;border-bottom:1px solid rgba(255,231,194,.16);}
.reviewDone{
  position:absolute;right:0;top:0;width:44px;height:44px;margin:0;padding:0;
  border-color:rgba(255,231,194,.22);border-radius:50%;background:rgba(25,16,10,.52);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);font-size:25px;font-weight:500;letter-spacing:0;
}
.reviewMoveInfo{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:70px;}
.reviewActor{display:inline-block;margin-bottom:7px;padding:5px 8px;border-radius:5px;font-size:10px;font-weight:900;line-height:1;letter-spacing:.1em;color:#fff;}
.reviewActor.player{background:#9f2c20;box-shadow:inset 0 1px 0 rgba(255,255,255,.18);}
.reviewActor.computer{background:#285e88;box-shadow:inset 0 1px 0 rgba(255,255,255,.16);}
.reviewActor.opening{background:#604a34;color:#eadcc3;}
.reviewStep b{font-size:16px;line-height:1.28;}
.reviewStep span{font-size:12px;line-height:1.4;margin-top:5px;white-space:normal;}
.reviewDiceSet{display:flex;gap:7px;flex:none;align-items:center;min-height:34px;}
.reviewDie{width:34px;height:34px;padding:5px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;border-radius:7px;background:linear-gradient(180deg,#fff,#e9e0cc);border:1px solid #8a8272;box-shadow:0 2px 4px rgba(0,0,0,.4);}
.reviewDie i{width:5px;height:5px;align-self:center;justify-self:center;border-radius:50%;background:#2b2418;opacity:0;}
.reviewDie i.on{opacity:1;}
.reviewDiceEmpty{color:#a99576;font-size:10px;font-weight:800;letter-spacing:.08em;white-space:nowrap;}
.reviewActions{grid-template-columns:1fr;gap:10px;padding:0;border:0;}
.reviewActions .pbtn{min-height:52px;padding:10px 8px;font-size:12px;line-height:1.2;}

.reviewAnalysis summary{
  min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  cursor:pointer;list-style:none;color:#f3dfc2;font-size:12px;font-weight:850;letter-spacing:.06em;touch-action:manipulation;
}
.reviewAnalysis summary::-webkit-details-marker{display:none;}
.reviewAnalysis summary::after{content:'›';font-size:24px;font-weight:400;line-height:1;color:#c9b18e;transform:rotate(90deg);transition:transform .16s ease;}
.reviewAnalysis[open] summary::after{transform:rotate(-90deg);}
.reviewAnalysisSummary{color:#a99576;font-size:10px;font-weight:650;letter-spacing:0;text-align:right;}
.reviewMetrics{display:grid;grid-template-columns:1fr;gap:0;padding:0 0 10px;border:0;}
.reviewMetric{display:flex;align-items:center;justify-content:space-between;min-height:43px;padding:7px 10px;border-radius:0;background:rgba(23,16,11,.54);color:#cbb99c;font-size:10px;letter-spacing:.055em;text-align:left;}
.reviewMetric+.reviewMetric{border-top:1px solid rgba(255,231,194,.08);}
.reviewMetric b{display:block;margin:0;color:#fff4df;font-size:15px;font-variant-numeric:tabular-nums;}
.reviewNavBlock{margin-top:auto;padding-top:0;border:0;}
.reviewCounter{margin-bottom:10px;color:#f1dec1;font-size:13px;font-weight:750;}
.reviewNav{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:'prev next' 'prevkey nextkey';gap:9px;}
.reviewNav .pbtn{height:50px;padding:7px 5px;}
.reviewNav #rPrev{grid-area:prev;}
.reviewNav #rNext{grid-area:next;}
.reviewNav #rPrevKey{grid-area:prevkey;}
.reviewNav #rNextKey{grid-area:nextkey;}
.reviewNav .keyJump{font-size:10.5px;line-height:1.15;padding:6px;}
#reviewTimelineDock .reviewTimeline{height:100%;margin:0;padding:0;}
#reviewTimelineDock .reviewTimelineMeta{font-size:10.5px;font-weight:750;letter-spacing:.045em;}
#reviewTimelineDock .timelineWrap{height:45px;margin-top:3px;}
#reviewTimelineDock .reviewRange{top:4px;height:32px;}
#reviewTimelineDock .reviewRange::-webkit-slider-runnable-track{height:7px;}
#reviewTimelineDock .reviewRange::-webkit-slider-thumb{width:24px;height:24px;margin-top:-9px;border-width:3px;}
#reviewTimelineDock .reviewRange::-moz-range-track,#reviewTimelineDock .reviewRange::-moz-range-progress{height:7px;}
#reviewTimelineDock .reviewRange::-moz-range-thumb{width:20px;height:20px;border-width:3px;}
#reviewTimelineDock .timelineTicks{left:12px;right:12px;top:17px;height:7px;}

@media (orientation:landscape) and (max-height:650px){
  body.reviewing #side{flex-basis:260px;padding:12px 13px;}
  .reviewHud{gap:11px;}
  .reviewHudTop{padding-bottom:10px;}
  .reviewMoveInfo{gap:8px;}
  .reviewDie{width:30px;height:30px;padding:4px;}
  .reviewActions{grid-template-columns:1fr 1fr;gap:8px;}
  .reviewActions .pbtn,.reviewNav .pbtn{min-height:44px;height:44px;}
  .reviewAnalysis summary{min-height:44px;}
  .reviewMetric{min-height:38px;}
  .reviewCounter{margin-bottom:6px;}
}
@media (max-aspect-ratio:1/1){
  #playArea{flex:1 1 0;min-height:0;}
  body.reviewing #side{width:calc(100% - 12px);height:auto;min-height:164px;padding:8px 10px;}
  body.reviewing #reviewTimelineDock{flex-basis:76px;margin:0 6px 5px;padding:8px 14px 4px;}
  .reviewHud{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto auto;gap:7px 10px;}
  .reviewHudTop{grid-column:1;grid-row:1;padding:0 38px 7px 0;}
  .reviewMoveInfo{gap:7px;min-height:38px;}
  .reviewDiceSet{gap:4px;}
  .reviewDie{width:27px;height:27px;padding:4px;}
  .reviewActions{grid-column:1;grid-row:2;grid-template-columns:1fr 1fr;gap:6px;}
  .reviewActions .pbtn,.reviewNav .pbtn{min-height:38px;height:38px;padding:4px 2px;}
  .reviewAnalysis{display:none;}
  .reviewNavBlock{grid-column:2;grid-row:1/3;margin-top:0;}
  .reviewCounter{margin-bottom:4px;}
}

function waitForLandscape(){
  if(!ORIENTATION_PAUSE.blocked)return Promise.resolve();
  return new Promise(resolve=>ORIENTATION_PAUSE.resumeWaiters.push(resolve));
}
async function sleep(ms){
  let remaining=Math.max(0,Number(ms)||0);
  await waitForLandscape();
  while(remaining>0){
    const started=performance.now();
    const elapsed=await new Promise(resolve=>{
      let done=false;
      const finish=()=>{if(done)return;done=true;clearTimeout(timer);ORIENTATION_PAUSE.pauseWaiters.delete(onPause);resolve(performance.now()-started);};
      const onPause=()=>finish();
      const timer=setTimeout(finish,remaining);
      ORIENTATION_PAUSE.pauseWaiters.add(onPause);
    });
    remaining=Math.max(0,remaining-elapsed);
    if(remaining>0)await waitForLandscape();
  }
}

function drawReviewSequence(startState,seq,color,kind){

    const dx=to.x-from.x,dy=to.y-from.y,bend=(kind==='best'?-1:1)*(18+i*5);

function formatBytes(n){
  if(!Number.isFinite(n)||n<1)return'0 B';
  const units=['B','KB','MB'],i=Math.min(units.length-1,Math.floor(Math.log(n)/Math.log(1024)));
  return (n/Math.pow(1024,i)).toFixed(i?1:0)+' '+units[i];

function paintEngineProgress(s){
  const track=$('engineProgress'),bar=$('engineProgressBar'),amount=$('engineAmount'),retry=$('engineRetry');
  if(!track||!bar||!amount||!retry)return;
  const known=s.total>0,pct=known?Math.max(0,Math.min(100,s.loaded/s.total*100)):0;
  track.classList.toggle('indeterminate',!known&&s.status!=='waiting');
  track.setAttribute('aria-valuetext',known?pct.toFixed(0)+' percent':s.status==='waiting'?'Waiting to retry':'Downloading');
  if(known){track.setAttribute('aria-valuenow',pct.toFixed(0));track.setAttribute('aria-valuemax','100');bar.style.width=pct+'%';}
  else{track.removeAttribute('aria-valuenow');track.removeAttribute('aria-valuemax');bar.style.width='';}
  amount.textContent=known?formatBytes(s.loaded)+' of '+formatBytes(s.total):(s.loaded?formatBytes(s.loaded)+' downloaded':'Size not reported');
  if(s.status==='waiting')retry.textContent='Download interrupted · retry '+(s.attempt+1)+' in '+Math.max(1,Math.ceil(s.retryIn/1000))+'s';
  else if(s.attempt>1)retry.textContent='Retry '+s.attempt+' · downloading again';
  else retry.textContent='Download in progress';
}

function fullscreenElement(){

function isFullscreen(){return !!fullscreenElement()||document.webkitIsFullScreen===true;}
function fullscreenTarget(){

  // reliable whole-page target in iPad Safari and keeps every dialog inside.

function fullscreenAvailable(){
  const root=fullscreenTarget();

  const hasRequest=typeof root.webkitRequestFullscreen==='function'||typeof root.requestFullscreen==='function';
  const policyAllows=document.webkitFullscreenEnabled!==false&&document.fullscreenEnabled!==false;

function syncFullscreenToggle(){

function fullscreenFailed(error){
  fullscreenPending=false;
  clearTimeout(fullscreenCheckTimer);
  fullscreenControls().forEach(control=>control.removeAttribute('aria-busy'));
  syncFullscreenToggle();
  fullscreenFeedback('Safari blocked fullscreen — tap again');
  toast('Fullscreen was blocked by Safari. Tap the switch again.',2600);

function toggleFS(){
  // Keep the API call synchronous with the trusted tap. In particular, do not
  // await, play audio, or close the menu before calling WebKit on iPad Safari.
  if(fullscreenPending)return;
  const root=fullscreenTarget();
  if(!root){fullscreenFailed();return;}
  fullscreenPending=true;
  fullscreenControls().forEach(control=>control.setAttribute('aria-busy','true'));
  try{
    let result;
    if(!isFullscreen()){
      // iPad Safari exposes the prefixed API; standards-based browsers use the
      // fallback. The method is called with its owning element as `this`.
      if(typeof root.webkitRequestFullscreen==='function')result=root.webkitRequestFullscreen();
      else if(typeof root.requestFullscreen==='function')result=root.requestFullscreen({navigationUI:'hide'});
      else{fullscreenFailed();return;}
    }else{
      if(typeof document.webkitExitFullscreen==='function')result=document.webkitExitFullscreen();
      else if(typeof document.exitFullscreen==='function')result=document.exitFullscreen();
      else{fullscreenFailed();return;}
    }
    if(result&&typeof result.then==='function')result.then(syncFullscreenToggle).catch(fullscreenFailed);
    // Legacy WebKit returns void; its change/error event normally resolves the
    // state. The delayed check prevents a rejected request from looking dead.
    fullscreenCheckTimer=setTimeout(()=>{
      if(fullscreenPending){
        if(isFullscreen())syncFullscreenToggle();
        else fullscreenFailed();
      }
    },900);
  }catch(e){fullscreenFailed(e);}
}
function wireFullscreenControl(control){
  if(!control)return;
  // Use touchend directly on iPad so the WebKit call remains inside the same
  // touch gesture. preventDefault suppresses the later synthetic click.
  control.addEventListener('touchend',e=>{
    if(control.disabled)return;
    e.preventDefault();
    fullscreenTouchHandled=true;
    toggleFS();
    Snd.pick();
    setTimeout(()=>{fullscreenTouchHandled=false;},500);
  },{passive:false});
  control.addEventListener('click',()=>{
    if(fullscreenTouchHandled||control.disabled)return;
    toggleFS();
    Snd.pick();
  });
}

function bearOffChoice(){
  if(GAME.phase!=='moving')return null;
  const selected=GAME.destsNow.find(d=>d.to==='off');
  if(selected)return selected;
  // Derive the available bear-off from the current position and remaining dice
  // instead of trusting a sequence cache that may still describe the prior
  // position for a frame after an animated move or Undo.
  const currentSeqs=GAME.state?legalSequences(GAME.state,GAME.sideHuman,GAME.remaining):[];
  for(const seq of currentSeqs){
    if(!seq.length)continue;
    // Prefer a complete consecutive route for one checker, including a legal
    // two-die or doubles route whose final step bears it off.
    const moves=[];
    let expectedFrom=seq[0].from;
    for(const move of seq){
      if(move.from!==expectedFrom)break;
      moves.push(move);
      if(move.to==='off')return Object.assign({},move,{moves:moves.slice(),compound:moves.length>1});
      expectedFrom=move.to;
    }
  }
  return null;
}

async function rolloff(tok){
  GAME.phase='rolloff';syncUI();
  let a,b;
  do{
    if(tok!==GAME.token)return;
    a=1+Math.floor(Math.random()*6);b=1+Math.floor(Math.random()*6);
    await tumbleDice([a,b],MOTION.diceRollOff,'rolloff');
    if(tok!==GAME.token)return;
    await sleep(620);
  }while(a===b);
  const youFirst=a>b;
  const firstSide=youFirst?GAME.sideHuman:GAME.sideAI;
  const firstName=youFirst?GAME.nameYou:GAME.nameOpp;
  openDlg('',`${escHtml(firstName)} has won the dice roll.<br>${colorName(firstSide)} goes first.`,[
    {label:'OKAY',cls:'btnOkay',fn:()=>{
      hideOverlay();
      if(tok!==GAME.token)return;
      // keep the roll-off dice on the board; the winner plays those values
      if(youFirst){GAME.diceVals=[a,b];enterMoving([a,b]);}
      else aiTurn([a,b]);
    }}
  ]);
}
function rollPair(){return[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];}
function playableDice(pair){return pair[0]===pair[1]?[pair[0],pair[0],pair[0],pair[0]]:pair.slice();}
function humanTurn(){
  // Every route into the player's roll phase comes through here: a completed
  // computer turn, either no-move acknowledgement, and undoing a computer
  // turn. Reset all per-roll state atomically so stale dice or selections can
  // neither cover the control nor make the board look ready while it is not.
  GAME.remaining=[];GAME.diceVals=[];GAME.seqs=[];GAME.snaps=[];
  GAME.selected=null;GAME.destsNow=[];GAME.sourcesNow=[];
  GAME.turnStart=null;GAME.turnMoves=[];GAME.turnRecorded=false;
  clearDice();clearHL();
  GAME.phase='preroll';syncUI();
}
async function onRoll(){
  if(GAME.phase!=='preroll')return;
  GAME.phase='rolling';syncUI();
  const tok=GAME.token;
  const cast=rollPair(),dice=playableDice(cast);
  GAME.diceVals=dice.slice();
  clearDice();
  await tumbleDice(cast,MOTION.diceTurn,'human');
  if(tok!==GAME.token)return;
  if(cast[0]===cast[1]){await revealDouble(cast[0]);if(tok!==GAME.token)return;}

async function aiTurn(openingDice){
  GAME.phase='ai';syncUI();clearHL();

  await sleep(900);if(tok!==GAME.token)return;

  if(openingDice){dice=openingDice;showDice(dice);}
  else{
    const cast=rollPair();dice=playableDice(cast);clearDice();
    await tumbleDice(cast,MOTION.diceTurn,'computer');
    if(tok!==GAME.token)return;
    if(cast[0]===cast[1]){await revealDouble(cast[0]);if(tok!==GAME.token)return;}
  }
  if(tok!==GAME.token)return;

  // computer. (Previously this still held the player's prior roll.) Undo now
  // has a complete turn boundary even though returning to preroll clears it.

  await ensureGNUReady(tier.label+' computer');
  if(tok!==GAME.token)return;

    showAiNoMoveDialog(tok,false);

  }

  // backward one checker at a time.

  const dimd=new Set();
  for(const m of seq){
    const movingId=movingCheckerId(GAME.state,m,GAME.sideAI);
    const hitId=m.hit?GAME.state.points[m.to][GAME.state.points[m.to].length-1]:null;
    GAME.state=applyMove(GAME.state,m,GAME.sideAI);GAME.turnMoves.push(Object.assign({},m));
    const st=GAME.state;
    if(m.to!=='off'){const top=st.points[m.to][st.points[m.to].length-1];if(CK[top])toFront(CK[top]);}
    if(hitId&&CK[hitId])toFront(CK[hitId]);

    }
    const motion=animateMoveLayout(st,m,movingId,hitId,'computer');
    if(m.to!=='off')updatePanel();
    if(m.hit)Snd.hit(motion.moveMs,motion.barDelayMs,motion.barMoveMs);
    else if(m.to==='off')Snd.bear(motion.moveMs);
    else Snd.place(motion.moveMs);
    await sleep(motion.totalMs+MOTION.settle);
    if(tok!==GAME.token)return;
    if(m.to==='off')updatePanel();

  }

  // discard an unusable second die (or the rest of a double); the observer
  // must acknowledge the blocked remainder before the turn can pass.
  if(dimd.size<dice.length){
    showAiNoMoveDialog(tok,true);
    return;
  }

  if(tok!==GAME.token)return;
  clearDice();
  await sleep(250);
  if(tok!==GAME.token)return;
  humanTurn();

function tapSource(from){
  const seen=new Set();const dests=[];
  for(const q of GAME.seqs){
    if(!q.length||q[0].from!==from)continue;
    // Every consecutive prefix that keeps moving this checker is a legal
    // target. legalSequences has already applied the mandatory intermediate
    // landing checks, so blocked points automatically stop the chain. This
    // includes all four prefixes for doubles: D, D+D, D+D+D and D+D+D+D.
    const chain=[];
    let expectedFrom=from;
    for(const move of q){
      if(move.from!==expectedFrom)break;
      chain.push(move);
      const label=chain.map(m=>m.die).sort((a,b)=>a-b).join('+');
      const key=move.to+'|'+label;
      if(!seen.has(key)){
        seen.add(key);
        dests.push(Object.assign({},move,{
          label,
          moves:chain.slice(),
          compound:chain.length>1
        }));
      }
      if(move.to==='off')break;
      expectedFrom=move.to;
    }
  }
  if(!dests.length)return;
  GAME.selected=from;GAME.destsNow=dests;
  markSelection(from,dests,GAME.state);Snd.pick();
}
function onSourceTap(from){
  if(GAME.selected===from||GAME.selected==from){
    // deselect
    GAME.selected=null;GAME.destsNow=[];
    markSources(GAME.sourcesNow,GAME.state);Snd.pick();return;
  }
  tapSource(from);
}

  const q=legalSequences(st,GAME.sideHuman,rem);return !q.length||!q[0].length;

async function onUndo(){
  const blocked=['setup','newgame','rolloff','rolling','animating','tutor','over'].includes(GAME.phase);
  if(blocked)return;
  const s=GAME.history.pop();
  if(!s)return;
  const tok=++GAME.token;
  GAME.phase='animating';
  GAME.state=cloneState(s.state);GAME.remaining=s.remaining.slice();GAME.diceVals=s.diceVals.slice();
  GAME.record.length=Math.min(GAME.record.length,s.recordLength);
  GAME.turnStart=cloneTurnStart(s.turnStart);GAME.turnMoves=s.turnMoves.map(m=>Object.assign({},m));GAME.turnRecorded=s.turnRecorded;GAME.turnHistoryStart=s.turnHistoryStart;
  if(s.kind==='human-move')GAME.snaps.pop();
  GAME.selected=null;GAME.destsNow=[];GAME.sourcesNow=[];
  clearHL();syncUI();
  const undoMs=animateUndoLayout(GAME.state);
  updatePanel();
  await sleep(undoMs+MOTION.settle);
  if(tok!==GAME.token)return;
  // Restore the roll that belongs to this position. Dice consumed before the
  // restored point stay dimmed, making a multi-step undo easy to follow.
  const rem=GAME.remaining.slice();
  if(GAME.diceVals.length){
    showDice(GAME.diceVals);
    GAME.diceVals.forEach((v,i)=>{
      const k=rem.indexOf(v);
      if(k>=0)rem.splice(k,1);else dimDie(i);
    });
  }else clearDice();
  clearHL();
  if(s.kind==='human-move'){
    GAME.phase='moving';
    GAME.seqs=legalSequences(GAME.state,GAME.sideHuman,GAME.remaining);
    markHumanSources();
  }else{
    // The computer's whole turn is now gone, so return through the same atomic
    // player-turn boundary used by every normal completion path. History stays
    // intact, allowing another Undo into the completed player turn.
    humanTurn();
  }
}

const DRAG={ghost:null,id:null,from:null,sx:0,sy:0,on:false,pid:null};
function svgPoint(e){
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());

function idxFromScreen(e){
  const p=svgPoint(e);
  if(p.x<GV.X0||p.x>GV.X1||p.y<GV.Y0||p.y>GV.Y1)return null;
  if(p.x>GV.BARX-GV.BARW/2&&p.x<GV.BARX+GV.BARW/2)return null;
  let s=null;
  if(p.x<600){s=Math.round((p.x-76)/92);if(s<0||s>5)s=null;}
  else{s=Math.round((p.x-664)/92);if(s<0||s>5)s=null;else s=6+s;}
  if(s===null)return null;
  return p.y<GV.MID?(s<6?12+s:18+(s-6)):(11-s);
}

    piece.style.setProperty('--sway-c',swayC.toFixed(1)+'px');

    piece.style.setProperty('--spin-c',spin.toFixed(0)+'deg');
    // Double the original 2.5–3.2 second gentle fall, with a staggered start

function analysisSummary(side){
  const rows=GAME.record.filter(r=>r.side===side&&r.analysis);
  const total=rows.reduce((n,r)=>n+r.analysis.cost,0);
  const brilliant=rows.filter(r=>r.analysis.cost<=.005&&r.analysis.optionCount>=4&&r.analysis.bestMargin>=.08).length;
  const mistakes=rows.filter(r=>r.analysis.cost>=.08&&r.analysis.cost<.16).length;
  const blunders=rows.filter(r=>r.analysis.cost>=.16).length;
  const avg=rows.length?total/rows.length:0;
  // A plain, deterministic rating based on mean equity lost per turn.
  const accuracy=rows.length?Math.round(Math.max(0,Math.min(100,100-avg*100))):null;
  return{rows,total,brilliant,mistakes,blunders,avg,accuracy};
}
function humanAnalysisSummary(){return analysisSummary(GAME.sideHuman);}
function keyMoments(){
  const out=[];
  GAME.record.forEach((row,recordIndex)=>{
    if(row.side!==GAME.sideHuman||!row.analysis)return;
    const a=row.analysis;
    if(a.cost>=.12)out.push({type:'blunder',recordIndex,row,impact:a.cost});
    else if(a.cost<=.005&&a.optionCount>=4&&a.bestMargin>=.08)out.push({type:'brilliant',recordIndex,row,impact:a.bestMargin});
  });
  return out;

async function animateReplayNavigation(targetIndex){

    let st=cloneState(from===0?GAME.record[0].before:GAME.record[from-1].after);

    for(let r=from;r<target;r++){
      const row=GAME.record[r],actor=row.side===GAME.sideAI?'computer':'human';
      for(const m of row.moves){

        const hitId=m.hit?st.points[m.to][st.points[m.to].length-1]:null;

        const motion=animateMoveLayout(st,m,movingId,hitId,actor);updatePanel();
        if(m.hit)Snd.hit(motion.moveMs,motion.barDelayMs,motion.barMoveMs);
        else if(m.to==='off')Snd.bear(motion.moveMs);
        else Snd.place(motion.moveMs);
        await sleep(motion.totalMs+MOTION.settle);
      }
      if(!row.moves.length)await sleep(180);
    }

    GAME.state=cloneState(from===0?GAME.record[0].before:GAME.record[from-1].after);

/* Backgammon <-> Firebase Firestore sync, with required email/password sign-in.
 *
 * WHAT: Email/password sign-in is REQUIRED to use the app. On first launch the
 * user creates an account (or signs in); the session persists, so it is a
 * one-time step per browser. Finished games save to the signed-in user's
 * private Firestore collection users/{uid}/games, so one account = one shared

 * Google OAuth because Google blocks OAuth inside iOS home-screen web apps
 * (disallowed_useragent); the email flow is pure API calls and works
 * everywhere. Games saved earlier under an anonymous id are migrated into the
 * account on first sign-in.

 * unsaved session entries. Tapping a cloud entry opens Game Review replay.
 *

 * before </body> of the deployed index.html (see INTEGRATION.md). It does NOT
 * modify backgammon.html. It monkey-patches at load:
 *   - window.endGame           -> after a game ends, queue a Firestore save
 *   - window.pastGamesListHtml -> render cloud games + unsaved session games
 *   - window.openMenu          -> append a SIGN OUT button

 * plus a full-screen login gate overlay shown until sign-in completes.
 *
 * FAILURE MODE: anything Firebase-related that fails before sign-in keeps the
 * login gate up with a plain-language error for another attempt.
 * After sign-in, Firestore failures are silent: session-only history, no UI,
 * no popups, at most one console.warn.

  for(var i=0;i<GAME.pastGames.length;i++){
    var g=GAME.pastGames[i];
    if(g._syncId&&cloudSync[g._syncId])continue; // already shown in cloud list
    sessionBtns.push('<button class="pastGameBtn" data-past="'+i+'"><b>'+escHtml(g.resultLabel)+' · '+g.scoreLabel+'</b><span>'+escHtml(g.dateLabel)+' · Open review</span></button>');
  }
  var all=cloudBtns.concat(sessionBtns);
  if(!all.length)return orig();
  return all.join('');
}

/* ---------------- login gate ---------------- */
var GATE_CSS='position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;'
  +'background:radial-gradient(1300px 850px at 45% 30%,#2b1c12,#150d08);padding:20px;box-sizing:border-box;';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function authErrorMessage(err){
  var code=err&&err.code?String(err.code):'';
  if(code==='auth/operation-not-allowed')return'Email sign-in is not enabled for this app yet. Enable Email/Password in the Firebase console, then try again.';
  if(code==='auth/invalid-email')return'That email address doesn\u2019t look right.';
  if(code==='auth/user-not-found')return'No account found for that email. Tap \u201CCreate account\u201D below to make one.';
  if(code==='auth/wrong-password'||code==='auth/invalid-credential')return'Wrong email or password. Try again, or tap \u201CForgot password?\u201D.';
  if(code==='auth/email-already-in-use')return'That email already has an account. Sign in instead.';
  if(code==='auth/weak-password')return'Please choose a password with at least 6 characters.';
  if(code==='auth/too-many-requests')return'Too many attempts. Please wait a bit and try again.';
  if(code==='auth/network-request-failed')return'Could not reach the sign-in server. Check your connection and try again.';
  if(code==='auth/unauthorized-domain')return'This site is not authorized for sign-in. Add its domain under Authentication \u2192 Settings \u2192 Authorized domains.';
  return'Sign-in did not complete. Please try again.';
}

var emailMode='signin'; // or 'signup'

function showLoginGate(msg){
  var gate=document.getElementById('bgLoginGate');
  if(gate){
    var errEl=document.getElementById('bgLoginErr');
    if(errEl&&msg){errEl.textContent=msg;errEl.style.display='block';}
    return;
  }
  var d=document.createElement('div');
  d.id='bgLoginGate';
  d.setAttribute('style',GATE_CSS);
  var inputCss='display:block;width:100%;padding:13px 12px;margin:0 0 10px;border:1px solid #c9b98f;border-radius:10px;background:#fffdf6;font-size:16px;color:#3c3226;box-sizing:border-box;';
  d.innerHTML=
    '<div style="max-width:360px;width:100%;text-align:center;background:#f3e6c8;border-radius:16px;padding:28px 24px;box-shadow:0 18px 60px rgba(0,0,0,.6);box-sizing:border-box;">'
    +'<div style="font:800 30px Georgia,serif;color:#7a4a1e;letter-spacing:.06em;margin-bottom:6px;">BACKGAMMON</div>'
    +'<p style="color:#8a6f4d;font-size:13px;margin:0 0 18px;">Sign in to play.<br>Your games save to your account and follow you across devices.</p>'
    +'<input id="bgEmail" type="email" placeholder="Email" autocomplete="email" autocapitalize="none" spellcheck="false" style="'+inputCss+'">'
    +'<input id="bgPass" type="password" placeholder="Password" autocomplete="current-password" style="'+inputCss+'">'
    +'<button id="bgEmailBtn" style="display:block;width:100%;padding:13px;border:none;border-radius:10px;background:#7a4a1e;color:#fff8ea;font-size:16px;font-weight:700;cursor:pointer;">Sign In</button>'
    +'<p style="font-size:13px;margin:14px 0 0;color:#8a6f4d;"><a id="bgModeToggle" href="#" style="color:#7a4a1e;font-weight:700;text-decoration:none;">New here? Create account</a>'
    +' &nbsp;\u00B7&nbsp; <a id="bgForgot" href="#" style="color:#7a4a1e;text-decoration:none;">Forgot password?</a></p>'
    +'<p id="bgLoginErr" style="display:'+(msg?'block':'none')+';color:#a83226;font-size:12.5px;margin:12px 0 0;">'+esc(msg||'')+'</p>'
    +'<p style="color:#8a6f4d;font-size:10px;margin:10px 0 0;opacity:.55;">build 7</p>'
    +'</div>';
  document.body.appendChild(d);
  state.gateShown=true;
  var btn=document.getElementById('bgEmailBtn');
  var emailEl=document.getElementById('bgEmail');
  var passEl=document.getElementById('bgPass');
  var toggle=document.getElementById('bgModeToggle');
  var forgot=document.getElementById('bgForgot');
  function refreshMode(){
    btn.textContent=emailMode==='signup'?'Create Account':'Sign In';
    toggle.textContent=emailMode==='signup'?'Have an account? Sign in':'New here? Create account';
    if(passEl)passEl.setAttribute('autocomplete',emailMode==='signup'?'new-password':'current-password');
  }
  if(btn)btn.onclick=function(){startEmailAuth();};
  if(toggle)toggle.onclick=function(ev){if(ev&&ev.preventDefault)ev.preventDefault();emailMode=emailMode==='signup'?'signin':'signup';refreshMode();return false;};
  if(forgot)forgot.onclick=function(ev){if(ev&&ev.preventDefault)ev.preventDefault();forgotPassword();return false;};
  if(passEl)passEl.onkeydown=function(ev){if(ev&&(ev.key==='Enter'||ev.keyCode===13)){startEmailAuth();}};
  refreshMode();
  setTimeout(function(){try{if(emailEl)emailEl.focus();}catch(e){}},400);
}

function gateEmailPass(){
  var e=document.getElementById('bgEmail'),p=document.getElementById('bgPass');
  return {email:e?e.value.trim():'',pass:p?p.value:''};
}

function startEmailAuth(){
  var creds=gateEmailPass();
  if(!creds.email){showLoginGate('Please enter your email address.');return;}
  if(!creds.pass){showLoginGate('Please enter your password.');return;}
  if(emailMode==='signup'&&creds.pass.length<6){showLoginGate('Please choose a password with at least 6 characters.');return;}
  var btn=document.getElementById('bgEmailBtn');
  if(btn)btn.disabled=true;
  var done=function(){var b=document.getElementById('bgEmailBtn');if(b)b.disabled=false;};
  var op=emailMode==='signup'
    ?state.auth.createUserWithEmailAndPassword(creds.email,creds.pass)
    :state.auth.signInWithEmailAndPassword(creds.email,creds.pass);
  op.then(function(cred){
    if(cred&&cred.user)onSignedIn(cred.user);
    else done();
  },function(err){
    done();
    showLoginGate(authErrorMessage(err));
  });
}

function forgotPassword(){
  var creds=gateEmailPass();
  if(!creds.email){showLoginGate('Enter your email above first, then tap \u201CForgot password?\u201D.');return;}
  state.auth.sendPasswordResetEmail(creds.email).then(function(){
    showLoginGate('Password reset email sent. Check your inbox, then sign in with your new password.');
  },function(err){
    showLoginGate(authErrorMessage(err));
  });
}

function hideLoginGate(){
  var d=document.getElementById('bgLoginGate');
  if(d&&d.parentNode)d.parentNode.removeChild(d);
  state.gateShown=false;
}

/* Firestore Timestamps do not survive JSON; convert to millis and back. */
function serializeDocs(docs){
  return JSON.stringify(docs||[],function(k,v){
    if(v&&typeof v==='object'&&typeof v.toDate==='function'){
      return {__ts:v.toDate().getTime()};
    }
    return v;
  });
}
function deserializeDocs(s){
  if(!s)return [];
  try{
    return JSON.parse(s,function(k,v){
      if(v&&typeof v==='object'&&typeof v.__ts==='number'){
        return new firebase.firestore.Timestamp(Math.floor(v.__ts/1000),(v.__ts%1000)*1e6);
      }
      return v;
    });
  }catch(e){return [];}
}
function takeStashedMigration(){
  try{
    var s=sessionStorage.getItem('bgMig');
    sessionStorage.removeItem('bgMig');
    return deserializeDocs(s);
  }catch(e){return [];}
}

function doSignOut(){
  try{if(typeof Snd!=='undefined')Snd.btn();}catch(e){}
  if(state.auth)state.auth.signOut().then(function(){location.reload();},function(){location.reload();});
  else location.reload();
}

function addSignOut(){
  if(!(state.ready&&state.auth))return;
  if(!document.getElementById('mResume'))return; // only the real menu, not Past Games
  if(document.getElementById('bgSignOut'))return;
  var card=document.querySelector('.menuList');
  if(!card)return;
  var b=document.createElement('button');
  b.id='bgSignOut';b.className='pbtn';b.textContent='SIGN OUT';
  b.style.marginTop='10px';
  b.onclick=function(){doSignOut();};
  card.appendChild(b);
}

/* Signed-in email + sign-out on the setup screen (below the difficulty row). */
function injectUserBar(){
  if(!(state.ready&&state.auth))return;
  var body=document.querySelector('.setupBody');
  if(!body||document.getElementById('bgUserBar'))return;
  var email='';
  try{email=state.auth.currentUser&&state.auth.currentUser.email||'';}catch(e){}
  var bar=document.createElement('div');
  bar.id='bgUserBar';
  bar.style.cssText='margin:14px 0 0;font-size:12.5px;color:#8a6f4d;text-align:center;line-height:1.6;';
  bar.innerHTML='Signed in as <b>'+esc(email)+'</b><br><a href="#" id="bgSignOutSetup" style="color:#7a4a1e;font-weight:700;">Sign out</a>';
  body.appendChild(bar);
  var so=document.getElementById('bgSignOutSetup');
  if(so)so.onclick=function(ev){if(ev&&ev.preventDefault)ev.preventDefault();doSignOut();return false;};
}

/* ---------------- Firestore save / load ---------------- */
function num(n){return typeof n==='number'&&isFinite(n)?n:null;}

function buildDoc(entry){
  var lr=entry.lastResult||{};
  var tierKey=null,tierLabel=null,tierElo=null;
  try{
    tierKey=GAME.difficulty||null;
    var tier=(typeof AI_TIERS!=='undefined')&&tierKey?AI_TIERS[tierKey]:null;
    if(tier){tierLabel=tier.label;tierElo=tier.elo;}
  }catch(e){}
  var acc=null;
  try{
    var pick=function(s){
      return s?{total:num(s.total),brilliant:s.brilliant,mistakes:s.mistakes,blunders:s.blunders,accuracy:s.accuracy}:null;
    };
    acc={you:pick(humanAnalysisSummary()),opp:pick(analysisSummary(GAME.sideAI))};
  }catch(e){acc=null;}
  return {
    syncId:entry._syncId,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    appVersion:2,
    result:entry.resultLabel,resultLabel:entry.resultLabel,scoreLabel:entry.scoreLabel,
    scores:{you:lr.you!=null?lr.you:null,opp:lr.opp!=null?lr.opp:null},
    points:lr.points!=null?lr.points:null,
    winner:lr.winner||null,matchOver:!!lr.matchOver,
    difficulty:tierKey,difficultyLabel:tierLabel,difficultyElo:tierElo,
    nameYou:entry.nameYou,nameOpp:entry.nameOpp,
    sideHuman:entry.sideHuman,sideAI:entry.sideAI,
    accuracy:acc,
    record:entry.record,
    lastResult:lr,
    dateLabel:entry.dateLabel
  };
}

function cloudViewOf(entry,cloudId){
  return {
    cloudId:cloudId,syncId:entry._syncId,
    record:entry.record,lastResult:entry.lastResult,
    nameYou:entry.nameYou,nameOpp:entry.nameOpp,
    sideHuman:entry.sideHuman,sideAI:entry.sideAI,
    resultLabel:entry.resultLabel,scoreLabel:entry.scoreLabel,
    dateLabel:entry.dateLabel
  };
}

function saveGame(entry){
  if(!state.ready||!state.db||!state.uid)return;
  var doc;
  try{doc=buildDoc(entry);}catch(e){warnOnce('could not build save record');return;}
  try{
    state.db.collection('users').doc(state.uid).collection('games').add(doc).then(function(ref){
      entry._cloudId=ref.id;
      GAME.cloudGames.unshift(cloudViewOf(entry,ref.id));
    },function(){
      warnOnce('save failed; game kept for this session only');
    });
  }catch(e){warnOnce('save failed; game kept for this session only');}
}

function fmtDate(ts){
  try{
    var d=(ts&&typeof ts.toDate==='function')?ts.toDate():(ts instanceof Date?ts:null);
    if(!d)return '';
    return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d);
  }catch(e){return '';}
}

/* Raw game documents for a uid (used for both loading and migration). */
function readGameDocs(uid){
  return state.db.collection('users').doc(uid).collection('games')
    .orderBy('createdAt','desc').limit(50).get()
    .then(function(snap){
      var out=[];
      snap.forEach(function(doc){
        var d=doc.data()||{};
        if(!d.record||!d.lastResult)return;
        out.push(d);
      });
      return out;
    });
}

function docToView(docId,d){
  return {
    cloudId:docId,syncId:d.syncId||null,
    record:d.record,lastResult:d.lastResult,
    nameYou:d.nameYou||'You',nameOpp:d.nameOpp||'Computer',
    sideHuman:d.sideHuman||'b',sideAI:d.sideAI||'w',
    resultLabel:d.resultLabel||'Game',scoreLabel:d.scoreLabel||'',
    dateLabel:d.dateLabel||fmtDate(d.createdAt)
  };
}

function loadCloudGames(){
  if(!state.ready||!state.db||!state.uid)return;
  readGameDocs(state.uid).then(function(docs){
    GAME.cloudGames=docs.map(function(d,i){return docToView('g'+i,d);});
  },function(){
    warnOnce('could not load cloud games; showing session history only');
  });
}

/* Copy games saved under the pre-login anonymous id into the signed-in account. */
function migrateAnonGames(docs){
  if(!docs.length)return Promise.resolve();
  var col=state.db.collection('users').doc(state.uid).collection('games');
  return Promise.all(docs.map(function(d){
    var copy={};
    for(var k in d){if(Object.prototype.hasOwnProperty.call(d,k))copy[k]=d[k];}
    copy.appVersion=2;
    copy.migratedFrom='anonymous';
    return col.add(copy);
  })).then(function(){},function(){warnOnce('some older games could not be carried over');});
}

/* ---------------- sign-in flow ---------------- */
function onSignedIn(user){
  if(!user||user.isAnonymous) return;
  if(state.ready&&state.uid===user.uid) return; // already in (observer + redirect both fire)
  state.uid=user.uid;
  state.ready=true;
  hideLoginGate();
  try{injectUserBar();}catch(e){}
  var mig=state.pendingMigration||[];
  state.pendingMigration=[];
  var stashed=takeStashedMigration();
  if(stashed.length) mig=mig.concat(stashed);
  // De-dupe by syncId: the same doc may be in both lists.
  var seen={},uniq=[];
  mig.forEach(function(d){var k=d&&d.syncId||null;if(k&&seen[k])return;if(k)seen[k]=1;uniq.push(d);});
  var done=function(){loadCloudGames();};
  if(uniq.length){
    migrateAnonGames(uniq).then(done,done);
  }else{
    done();
  }
}

function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=src;s.async=true;
    s.onload=function(){res();};
    s.onerror=function(){rej(new Error('script load failed'));};
    document.head.appendChild(s);
  });
}

function boot(){
  var base='https://www.gstatic.com/firebasejs/'+FB_SDK_VER+'/';
  loadScript(base+'firebase-app-compat.js')
    .then(function(){return loadScript(base+'firebase-auth-compat.js');})
    .then(function(){return loadScript(base+'firebase-firestore-compat.js');})
    .then(function(){
      if(!window.firebase||!firebase.firestore||!firebase.auth)throw new Error('sdk incomplete');
      firebase.initializeApp(FB_CONFIG);
      state.auth=firebase.auth();
      state.db=firebase.firestore();
      // Sign-in detector: fires on restored sessions and cross-tab sign-ins.
      try{
        state.auth.onAuthStateChanged(function(u){
          if(u&&!u.isAnonymous) onSignedIn(u);
        });
      }catch(e){}
      // Show the gate promptly unless a session is already restoring.
      setTimeout(function(){ if(!state.ready) showLoginGate(); },600);
      // Once the observer has had a chance to report a restored session, look
      // for migratable pre-login games. Best effort: the anonymous provider may
      // be disabled, in which case this skips.
      setTimeout(function(){
        if(state.ready) return;
        var u=null; try{ u=state.auth.currentUser; }catch(e){}
        if(u&&!u.isAnonymous){ onSignedIn(u); return; }
        state.auth.signInAnonymously().then(function(cred){
          return readGameDocs(cred.user.uid);
        }).then(function(docs){
          state.pendingMigration=docs;
        }).catch(function(){
          state.pendingMigration=[];
        });
      },1500);
    })
    .then(null,function(){
      // SDK scripts failed to load (offline etc.)
      try{ showLoginGate('Could not load sign-in. Check your connection, then reload the page.'); }
      catch(e){ warnOnce('auth unavailable'); }
    });
}

/* ---------------- go ---------------- */
if(hookGame()){boot();}
})();
